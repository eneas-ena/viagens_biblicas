<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viagens Bíblicas</title>
<script src="porteiro.js" data-app="Viagens Bíblicas" data-versao="3.3.0"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: sala de aula da Escola MENTOR; solene e legível de longe no projetor e no iPad.
IDEA: o mapa é o quadro; tocar num lugar abre a ficha do estudo como um cartão de aula.
PICTURE: o mapa inteiro, com números dourados sobre cada parada; a ficha abre ao lado sem esconder o lugar.
COLOUR and TYPE: noite azul-petróleo e ouro (escuro); papel branco com tinta escura (claro). Cinzel + Source Sans 3.
LAYOUT: tela de entrada com cartões por época; no mapa, barra fina no topo, ficha à direita (embaixo no celular), paradas no rodapé.
*/
:root{color-scheme:light dark;
--bg:light-dark(#eef0ef,#0a1317);--panel:light-dark(#ffffff,#101c22);--ink:light-dark(#1b2226,#ede7d9);
--muted:light-dark(#5a6469,#a7b0b2);--line:light-dark(#d9d5cb,#22353e);--gold:light-dark(#8a6414,#e9c46a);
--goldbg:light-dark(#f6ecd4,#2a2412);--sea:light-dark(#0d5a7a,#82d4ff);--chip:light-dark(#f1ede3,#16262d);--fs:17px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.marca{font:700 18px/1 Cinzel,serif;color:var(--gold);margin-right:6px;white-space:nowrap}
.marca{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis}
#inicio{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--bg);display:none}
#inicio.on{display:block}
.topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:clamp(18px,3vw,34px) max(4vw,16px) 6px}
.topo .tt{flex:1 1 260px}
.topo h1{font:700 clamp(30px,5vw,46px)/1.05 Cinzel,serif;color:var(--gold);margin:0}
.topo p{margin:6px 0 0;color:var(--muted);font-size:17px}
.grupo{padding:10px max(4vw,16px) 6px}
.grupo h2{font:700 15px "Source Sans 3",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 10px;display:flex;gap:10px;align-items:baseline}
.grupo h2 small{font-weight:600;letter-spacing:0;text-transform:none;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:200px;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--panel) center/cover no-repeat;color:#fff;text-align:left;padding:0;font:inherit;cursor:pointer}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,12,18,0) 25%,rgba(5,12,18,.88))}
.card>div{position:relative;padding:14px 16px}
.card b{display:block;font:700 20px/1.15 Cinzel,serif;color:#fff;text-wrap:balance}
.card span{display:block;font-size:14px;color:#e9dfc6;margin-top:4px}
.card:hover{border-color:var(--gold)}.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card.breve{cursor:default;background:var(--chip);border-style:dashed}
.card.breve::before{display:none}
.card.breve b{color:var(--ink)}.card.breve span{color:var(--muted)}
.card .era{position:absolute;top:12px;left:12px;font:700 12px "Source Sans 3",sans-serif;font-style:normal;color:#1d1405;background:var(--gold);border-radius:20px;padding:3px 10px;z-index:1}
.breves .card{min-height:0}.breves .card b{font-size:17px}
.cbox{display:flex;flex-direction:column;gap:6px}
a.pdf,a.pdfTop{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:600 15px "Source Sans 3",sans-serif;text-decoration:none;white-space:nowrap}
a.pdf:hover,a.pdfTop:hover{border-color:var(--gold)}a.pdf:focus-visible,a.pdfTop:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.rodape{padding:22px max(4vw,16px) 30px;color:var(--muted);font-size:14px}
.ver{font-size:13px;color:var(--muted);padding:3px 8px;border:1px solid var(--line);border-radius:20px;white-space:nowrap}
button{font:600 15px "Source Sans 3",sans-serif;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:10px;min-height:40px;min-width:40px;padding:0 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--gold)}button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.on{background:var(--gold);color:var(--panel);border-color:var(--gold)}
button.pri{background:var(--gold);color:var(--panel);border-color:var(--gold)}
main{flex:1;position:relative;min-height:0}
#stage{position:absolute;inset:0;overflow:hidden;background:#061016;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .8s cubic-bezier(.3,.7,.2,1)}
#world.now{transition:none}
#world img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none;pointer-events:none}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#trecho{fill:none;stroke:#fff8d8;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.55;filter:drop-shadow(0 0 6px #ffd76a)}
#trechoBrilho{fill:none;stroke:#fff;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 9;animation:corre 1s linear infinite}
@keyframes corre{to{stroke-dashoffset:-19}}
#seta{fill:#fff;stroke:#1d1405;stroke-width:2.5;stroke-linejoin:round;filter:drop-shadow(0 0 5px #ffd76a)}
.semtrecho #ov{display:none}
.mk{position:absolute;transform:translate(-50%,-50%) scale(var(--inv,1));min-width:30px;height:30px;padding:0 7px;border-radius:15px;border:2px solid #fff;background:#d4a52c;color:#1d1405;font:700 15px/26px "Source Sans 3",sans-serif;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.55);transition:background .2s}
.mk.cur{background:#fff;color:#7a1c12;border-color:#ffd76a}
.mk.cur::after{content:"";position:absolute;inset:-8px;border-radius:22px;border:3px solid #ffe28a;animation:pulse 1.5s ease-out infinite}
.mk .nm{position:absolute;top:31px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 15px "Source Sans 3",sans-serif;color:#fff;text-shadow:0 0 4px #000,0 0 8px #000;pointer-events:none}
.semnum .mk{opacity:0}.semnum .mk.cur{opacity:1}
@keyframes pulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.6);opacity:0}}
#pop{position:absolute;top:12px;right:12px;bottom:12px;width:min(480px,44%);background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.45);display:none;flex-direction:column;z-index:5}
#pop.open{display:flex}
#popHead{display:flex;align-items:flex-start;gap:8px;padding:14px 14px 8px 20px;border-bottom:1px solid var(--line)}
#popHead .tt{flex:1}
#popHead .n{font-size:13px;font-weight:700;color:var(--muted)}
#popHead h2{font:700 calc(var(--fs) + 7px)/1.15 Cinzel,serif;color:var(--gold);margin:2px 0 4px;text-wrap:balance}
.ref{display:inline-block;font-weight:700;color:var(--sea);font-size:var(--fs)}
#visitas{display:flex;gap:6px;flex-wrap:wrap;padding:8px 20px 0}
#visitas button{min-height:34px;font-size:14px}
#popBody{overflow-y:auto;padding:12px 20px 20px;font-size:var(--fs)}
#popBody p{margin:0 0 12px}
.loc{color:var(--muted);font-size:calc(var(--fs) - 2px)}
.dest{font-weight:600;background:var(--goldbg);border-radius:10px;padding:10px 12px}
#popBody h3{font:700 13px "Source Sans 3",sans-serif;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 6px}
#popBody ul{margin:0 0 8px;padding-left:20px}#popBody li{margin-bottom:6px}
.apl{border-left:4px solid var(--sea);padding:6px 0 6px 12px}
blockquote{margin:14px 0;font:600 calc(var(--fs) + 1px)/1.4 Cinzel,serif;color:var(--gold);text-wrap:balance}
table{border-collapse:collapse;width:100%;font-size:calc(var(--fs) - 2px);margin:4px 0 10px}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
#perg{margin-top:14px}#perg p{display:none;margin-top:10px;font-weight:600;background:var(--chip);border-radius:10px;padding:12px}
#perg.show p{display:block}
#popTools{display:flex;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
#popTools .sp{flex:1}
#reabrir{position:absolute;right:12px;bottom:12px;z-index:4;display:none;box-shadow:0 6px 20px rgba(0,0,0,.4)}
footer{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line)}
#tl{flex:1;display:flex;gap:5px;overflow-x:auto;padding:2px}
#tl button{flex:none;min-width:40px;padding:0 9px;font-size:14px}
#bar{position:fixed;left:50%;top:62px;transform:translateX(-50%);background:var(--gold);color:var(--panel);padding:10px 14px;border-radius:12px;display:none;gap:10px;align-items:center;z-index:9;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#bar button{background:var(--panel);color:var(--ink)}
@media(max-width:760px){
 #pop{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:62%}
 .marca{display:none}.hide-s{display:none}
}
@media(prefers-reduced-motion:reduce){#world{transition:none}.mk.cur::after,#trechoBrilho{animation:none}}
</style>
</head>
<body>
<section id="inicio" aria-label="Escolha o estudo">
 <div class="topo"><div class="tt"><h1>Viagens Bíblicas</h1><p>Escola MENTOR · mapas interativos para dar aula</p></div>
  <span class="ver" id="ver2"></span><button class="bTema" title="Modo claro/escuro">☀︎</button><button class="bUpd" title="Atualizar app">↻</button><button id="bSair" title="Sair da conta">Sair</button></div>
 <div id="grupos"></div>
 <p class="rodape">Toque num mapa para abrir. Dentro dele, ▶ avança parada por parada e cada número abre a ficha do estudo.</p>
</section>
<header>
 <button id="bInicio" title="Voltar à tela inicial">◀ Início</button>
 <span class="marca" id="marca"></span>
 <span id="pdfTop"></span>
 <span class="ver" id="ver"></span>
 <button id="bNum" class="on hide-s" title="Mostrar ou ocultar os números no mapa">Números</button>
 <button id="bTr" class="on hide-s" title="Mostrar ou ocultar o trajeto animado">Trajeto</button>
 <button id="bGeral" title="Mapa inteiro (Esc)">Mapa inteiro</button>
 <button id="bFull" class="hide-s" title="Tela cheia (F)">⛶</button>
 <button class="bTema" title="Modo claro/escuro">☀︎</button>
 <button class="bUpd" title="Atualizar app">↻</button>
</header>
<main>
 <div id="stage"><div id="world"><img id="mapa" alt=""><svg id="ov"><path id="trecho"/><path id="trechoBrilho"/><polygon id="seta" points="0,-9 20,0 0,9 5,0"/></svg><div id="mks"></div></div></div>
 <section id="pop" role="dialog" aria-label="Informações do lugar">
  <div id="popHead"><div class="tt"><div class="n" id="pN"></div><h2 id="pT"></h2><span class="ref" id="pR"></span></div><button id="bFechar" aria-label="Fechar ficha">✕</button></div>
  <div id="visitas"></div>
  <div id="popBody"></div>
  <div id="popTools"><button id="bMenos" aria-label="Diminuir letra">A−</button><button id="bMais" aria-label="Aumentar letra">A+</button><span class="sp"></span><button id="bAnt" aria-label="Parada anterior">◀</button><button id="bProx" class="pri">Próxima ▶</button></div>
 </section>
 <button id="reabrir" class="pri">Abrir ficha</button>
</main>
<footer>
 <button id="bPrev" aria-label="Parada anterior">◀</button>
 <div id="tl"></div>
 <button id="bNext" class="pri">Próxima ▶</button>
</footer>
<script>
{
const APP_VERSION='3.3.0';
let W=1672,H=941;
const DADOS={"v1":{"aba":"1ª viagem","titulo":"A Primeira Viagem Missionária","w":1672,"h":941,"meta":{"texto":"Atos 13:1–14:28.","data":"46–48 d.C. (cronologia discutida).","equipe":"Barnabé, Paulo (Saulo) e João Marcos.","ideia":"A expansão do Evangelho é dirigida pelo Espírito Santo e envolve anúncio de Cristo, perseverança em meio à oposição, formação de discípulos e fortalecimento das igrejas.","roteiro":["IDA: Antioquia da Síria → Selêucia → Salamina → Pafos → Perge → Antioquia da Pisídia → Icônio → Listra → Derbe.","VOLTA: Derbe → Listra → Icônio → Antioquia da Pisídia → Perge → Atália → Antioquia da Síria.","São as principais paradas registradas em Atos 13–14, não necessariamente todos os locais atravessados. Antioquia da Síria (partida e chegada) e Antioquia da Pisídia (visitada no percurso) são cidades diferentes. A localização exata de Derbe continua debatida."]},"paradas":[{"n":1,"titulo":"ANTIOQUIA DA SÍRIA — O CHAMADO E O ENVIO","corpo":["Lucas identifica cinco profetas e mestres: Barnabé, Simeão chamado Níger, Lúcio de Cirene, Manaém e Saulo. Enquanto serviam ao Senhor e jejuavam, o Espírito Santo orientou a separação de Barnabé e Saulo. A igreja orou, jejuou, impôs as mãos e os enviou."],"listas":[{"t":"Lições teológicas","itens":["O chamado foi apresentado como iniciativa divina, não apenas projeto humano.","O envio aconteceu com reconhecimento da igreja e compromisso espiritual.","A imposição de mãos expressou identificação com a obra, e não a origem do chamado."]}],"ref":"Atos 13:1–3","local":"Região da antiga Síria romana, atual Antakya, Turquia.","aplicacao":"Vocação, preparo e maturidade precisam caminhar com responsabilidade e disposição para servir.","frase":"Quem é chamado por Deus não deve caminhar sem direção, nem servir sem compromisso.","pergunta":"Qual é a diferença entre desejar uma atividade religiosa e compreender um chamado ao serviço?"},{"n":2,"titulo":"SELÊUCIA — A PARTIDA PELO MAR","corpo":["Paulo e Barnabé desceram de Antioquia até Selêucia e embarcaram rumo à ilha de Chipre. Lucas não relata uma pregação ou milagre nesse porto, mas a parada marca o início prático do deslocamento missionário."],"listas":[{"t":"Lições teológicas","itens":["A orientação do Espírito não elimina planejamento e deslocamento.","Os missionários utilizaram os recursos e meios de transporte disponíveis."]}],"ref":"Atos 13:4","local":"Selêucia Piéria, porto próximo à atual Samandağ, Turquia.","aplicacao":"Uma boa iniciativa ministerial precisa traduzir oração em organização e ações concretas.","frase":"A obediência transforma uma direção recebida em passos efetivamente dados."},{"n":3,"titulo":"SALAMINA — A PALAVRA NAS SINAGOGAS","corpo":["Em Salamina, os missionários anunciaram a Palavra de Deus nas sinagogas judaicas. João Marcos os acompanhava como auxiliar. Barnabé era natural de Chipre (At 4:36), fato que pode ter favorecido a familiaridade com a ilha."],"listas":[{"t":"Lições teológicas","itens":["A evangelização encontra pontos de contato no conhecimento prévio dos ouvintes.","A abordagem pode considerar a cultura, preservando a fidelidade ao Evangelho."]}],"ref":"Atos 13:5","local":"Leste de Chipre, perto da atual Famagusta.","aplicacao":"O professor precisa conhecer o público e adequar sua linguagem ao nível de compreensão dos alunos.","frase":"Uma mensagem fiel pode ser apresentada de maneiras diferentes sem perder sua verdade."},{"n":4,"titulo":"PAFOS — ELIMAS E SÉRGIO PAULO","corpo":["Ao atravessarem a ilha, Paulo e Barnabé encontraram Barjesus, conhecido como Elimas, descrito como mágico e falso profeta. Ele tentava afastar o procônsul Sérgio Paulo da fé. Paulo, cheio do Espírito Santo, confrontou sua oposição; Elimas ficou temporariamente cego. O procônsul creu, impressionado com o ensino do Senhor. Atos 13:9 registra que Saulo também era chamado Paulo: não se trata de uma troca de nome ocorrida ali."],"listas":[{"t":"Lições teológicas","itens":["O Evangelho enfrenta resistência espiritual, cultural e intelectual.","A narrativa destaca a autoridade divina e a centralidade do ensino.","O episódio específico não autoriza líderes a amaldiçoar opositores."]}],"ref":"Atos 13:6–12","local":"Costa ocidental de Chipre, região da atual Pafos.","aplicacao":"Defender a fé com coragem, discernimento e integridade, sem manipulação ou hostilidade gratuita.","frase":"A verdade não precisa de manipulação para permanecer verdadeira.","pergunta":"Como enfrentar ensinos falsos sem abandonar o amor e a integridade?"},{"n":5,"titulo":"PERGE — A SAÍDA DE JOÃO MARCOS","corpo":["Vindos de Pafos, os missionários chegaram a Perge. João Marcos então deixou o grupo e retornou a Jerusalém. Lucas não esclarece o motivo; não é seguro atribuí-lo a medo, doença ou desavença. A saída causaria posteriormente uma discordância entre Paulo e Barnabé, mas Paulo mais tarde reconheceu a utilidade de Marcos para o ministério."],"listas":[{"t":"Lições teológicas","itens":["As equipes ministeriais podem enfrentar rupturas e decisões difíceis.","Uma falha anterior não precisa definir todo o futuro de alguém."]}],"ref":"Atos 13:13; cf. 15:36–39; 2Tm 4:11","local":"Panfília, perto da atual Antalya, Turquia.","aplicacao":"Cultivar perseverança nos compromissos, mas também reconhecer a possibilidade de amadurecimento e restauração.","frase":"Um capítulo difícil não precisa ser o último capítulo da nossa história."},{"n":6,"titulo":"ANTIOQUIA DA PISÍDIA — O SERMÃO DE PAULO","corpo":["Na sinagoga, Paulo foi convidado a trazer uma palavra. Seu sermão reconstruiu a ação divina na história de Israel, anunciou Jesus como descendente prometido de Davi, falou da rejeição, morte e ressurreição de Cristo e proclamou o perdão dos pecados e a justificação mediante a fé (13:38–39). Muitos demonstraram interesse, mas houve oposição. No sábado seguinte grande parte da cidade ouviu a Palavra. Paulo e Barnabé citaram Isaías 49:6, explicando a extensão do Evangelho aos gentios. Foram expulsos, porém os discípulos permaneceram cheios de alegria e do Espírito Santo (13:52)."],"listas":[{"t":"Lições teológicas","itens":["Cristo é o cumprimento das promessas divinas e o centro da pregação.","O perdão e a justificação são anunciados por meio de Jesus.","A rejeição humana não impede o avanço do Evangelho; a alegria espiritual não depende de aceitação social."]}],"tabela":[["Texto","Ênfase"],["At 13:16–22","História de Israel até Davi"],["At 13:23–25","Jesus, Salvador prometido"],["At 13:26–29","Rejeição e morte de Jesus"],["At 13:30–37","Ressurreição e cumprimento das Escrituras"],["At 13:38–41","Perdão, justificação e advertência"]],"ref":"Atos 13:14–52","local":"Próximo à atual Yalvaç, Turquia.","aplicacao":"Preparar sermões e aulas que expliquem o contexto, conduzam a Cristo e convidem a uma resposta de fé.","frase":"A verdadeira pregação não coloca o mensageiro no centro; ela conduz os ouvintes a Cristo.","pergunta":"O que distingue uma exposição bíblica cristocêntrica de uma fala motivacional com versículos?","tabTit":"Estrutura do sermão de Antioquia da Pisídia"},{"n":7,"titulo":"ICÔNIO — FÉ, SINAIS E OPOSIÇÃO","corpo":["Na sinagoga de Icônio, muitos judeus e gregos creram. Alguns opositores provocaram hostilidade, mas Paulo e Barnabé permaneceram por bastante tempo, falando ousadamente, enquanto o Senhor confirmava a palavra de sua graça com sinais. A cidade se dividiu; diante de uma tentativa de violência e apedrejamento, os missionários fugiram para Listra e Derbe."],"listas":[{"t":"Lições teológicas","itens":["Fidelidade ao Evangelho não garante aceitação social.","Os sinais acompanhavam a mensagem, mas não anulavam a liberdade de rejeitá-la.","Coragem e prudência podem caminhar juntas."]}],"ref":"Atos 13:51–14:6","local":"Atual Konya, Turquia.","aplicacao":"Discernir quando perseverar no mesmo lugar e quando mudar a estratégia sem abandonar a missão.","frase":"A coragem sustenta a missão; a prudência orienta os seus passos."},{"n":8,"titulo":"LISTRA — DO MILAGRE AO APEDREJAMENTO","corpo":["Um homem incapaz de andar desde o nascimento foi curado ao ouvir Paulo. A população interpretou o sinal segundo suas crenças pagãs, chamando Barnabé de Zeus e Paulo de Hermes. Os missionários rejeitaram a tentativa de adoração e anunciaram o Deus vivo, Criador e provedor (14:15–17). Em seguida, adversários vindos de Antioquia e Icônio persuadiram a multidão, e Paulo foi apedrejado e arrastado para fora como se estivesse morto. O relato não afirma que tenha morrido e ressuscitado. Após se levantar, Paulo entrou na cidade; no dia seguinte seguiu para Derbe."],"listas":[{"t":"Lições teológicas","itens":["Os servos de Deus não devem receber a glória que pertence a Ele.","A abordagem aos pagãos começou pelo Criador e sua providência.","A aprovação popular é instável; o sofrimento não anulou a missão."]}],"ref":"Atos 14:6–20","local":"Licaônia, região de Hatunsaray, próxima a Konya, Turquia.","aplicacao":"Ensinar com humildade, adaptar a explicação ao público e não depender de aplausos.","frase":"Quem vive para a aprovação das pessoas ficará preso às mudanças de opinião das pessoas.","pergunta":"Como distinguir honra legítima a um líder de culto à sua personalidade?"},{"n":9,"titulo":"DERBE — DISCÍPULOS APÓS O SOFRIMENTO","corpo":["Depois da violência em Listra, Paulo e Barnabé chegaram a Derbe, anunciaram o Evangelho e fizeram muitos discípulos. Lucas não registra perseguição específica nessa cidade. Derbe foi o ponto final da etapa terrestre de ida antes do retorno por cidades previamente visitadas."],"listas":[{"t":"Lições teológicas","itens":["As dificuldades não precisam interromper a obediência.","A missão procura formar discípulos, não apenas reunir ouvintes."]}],"ref":"Atos 14:20–21","local":"Antiga Licaônia, na atual Turquia; sítio exato discutido.","aplicacao":"O ensino cristão deve visar transformação e amadurecimento, não somente transmissão de informação.","frase":"O fruto verdadeiro do ministério não é apenas uma decisão momentânea, mas uma vida em discipulado."},{"n":10,"titulo":"RETORNO A LISTRA","corpo":["Paulo retorna à cidade onde fora apedrejado. O objetivo era confirmar os ânimos dos discípulos e exortá-los a permanecer na fé, mesmo diante de tribulações."],"listas":[],"ref":"Atos 14:21–22","licao":"A responsabilidade pastoral inclui cuidar dos recém-convertidos, especialmente nas provações."},{"n":11,"titulo":"RETORNO A ICÔNIO","corpo":["Apesar das ameaças anteriores, os missionários retornam à região para fortalecer a fé e dar continuidade ao trabalho."],"listas":[],"ref":"Atos 14:21–23","licao":"Maturidade cristã significa perseverar nas dificuldades, não esperar uma vida sem oposição."},{"n":12,"titulo":"RETORNO A ANTIOQUIA DA PISÍDIA","corpo":["Lucas resume a ação realizada nas igrejas do retorno: confirmação dos discípulos, exortação à perseverança, designação de presbíteros, oração e jejum. O texto não atribui cada nomeação a uma cidade isolada."],"listas":[],"ref":"Atos 14:21–24","licao":"Discipulado, liderança responsável e dependência de Deus sustentam a continuidade da obra."},{"n":13,"titulo":"RETORNO A PERGE","corpo":["Depois de atravessarem Pisídia e Panfília, anunciaram a Palavra em Perge. A pregação ali está registrada expressamente na volta."],"listas":[],"ref":"Atos 14:24–25","licao":"O serviço fiel não depende de acontecimentos espetaculares."},{"n":14,"titulo":"ATÁLIA — EMBARQUE","corpo":["Desceram ao porto de Atália, na região da atual Antalya, e embarcaram para Antioquia da Síria. Lucas não menciona outros episódios missionários específicos na cidade."],"listas":[],"ref":"Atos 14:25–26","licao":"A missão também depende de logística, organização e tarefas de apoio."},{"n":15,"titulo":"ANTIOQUIA DA SÍRIA — PRESTAÇÃO DE CONTAS","corpo":["De volta à igreja que os havia confiado à graça de Deus, os missionários reuniram os irmãos e relataram tudo o que Deus fizera por meio deles, em especial como abrira a porta da fé aos gentios. Permaneceram ali bastante tempo."],"listas":[],"ref":"Atos 14:26–28","licao":"O envio envolve cooperação e prestação de contas, e os frutos devem ser reconhecidos como obra de Deus.","frase":"Uma missão madura não apenas alcança pessoas; ela prepara líderes para cuidar delas."}],"lugares":[{"id":"antS","x":1404,"y":548,"nome":"Antioquia da Síria","p":[1,15]},{"id":"sel","x":1263,"y":623,"nome":"Selêucia","p":[2]},{"id":"sal","x":992,"y":732,"nome":"Salamina","p":[3]},{"id":"paf","x":592,"y":808,"nome":"Pafos","p":[4]},{"id":"per","x":472,"y":445,"nome":"Perge","p":[5,13]},{"id":"antP","x":542,"y":212,"nome":"Antioquia da Pisídia","p":[6,12]},{"id":"ico","x":808,"y":260,"nome":"Icônio","p":[7,11]},{"id":"lis","x":780,"y":349,"nome":"Listra","p":[8,10]},{"id":"der","x":961,"y":394,"nome":"Derbe","p":[9]},{"id":"ata","x":416,"y":481,"nome":"Atália","p":[14]}],"trechos":{"2":[[1404,548],[1380,551],[1365,558],[1343,561],[1305,599],[1303,609],[1280,610],[1271,619],[1267,619],[1263,623]],"3":[[1263,623],[1195,625],[1185,627],[1150,661],[1128,661],[1107,676],[1067,696],[1023,715],[1013,715],[1000,728],[996,728],[992,732]],"4":[[992,732],[967,735],[935,758],[918,765],[901,769],[886,784],[758,784],[701,791],[699,793],[632,795],[603,800],[592,808]],"5":[[592,808],[504,717],[504,698],[489,669],[472,624],[463,587],[460,562],[460,491],[475,463],[475,448],[472,445]],"6":[[472,445],[473,355],[499,329],[499,288],[505,250],[542,212]],"7":[[542,212],[614,213],[634,218],[658,242],[764,243],[795,250],[808,260]],"8":[[808,260],[808,285],[800,313],[796,319],[796,323],[790,336],[780,349]],"9":[[780,349],[787,357],[790,357],[801,366],[809,369],[827,372],[850,373],[874,378],[889,393],[961,394]],"10":[[961,394],[946,392],[930,387],[887,383],[858,376],[845,363],[794,363],[780,349]],"11":[[780,349],[784,336],[796,320],[804,302],[807,288],[807,272],[810,269],[810,262],[808,260]],"12":[[808,260],[805,260],[799,255],[792,255],[785,251],[766,246],[707,243],[693,231],[663,231],[643,222],[614,215],[580,212],[555,212],[552,209],[545,209],[542,212]],"13":[[542,212],[542,238],[539,247],[516,271],[516,321],[510,341],[499,360],[494,375],[493,386],[491,389],[491,413],[486,418],[486,427],[478,435],[477,440],[472,445]],"14":[[472,445],[466,445],[448,453],[437,454],[420,471],[420,475],[416,481]],"15":[[416,481],[416,484],[421,490],[425,490],[437,499],[451,503],[459,511],[486,511],[508,517],[589,543],[653,566],[699,579],[742,588],[805,596],[846,598],[1025,598],[1070,592],[1156,592],[1192,604],[1202,610],[1305,610],[1333,586],[1346,582],[1373,579],[1404,548]]}},"v2":{"aba":"2ª viagem","titulo":"A Segunda Viagem Missionária","w":1672,"h":941,"meta":{"texto":"Atos 15:36–18:22.","data":"49–52 d.C.; cronologia aproximada, discutida entre estudiosos.","equipe":"Paulo e Silas; Timóteo junta-se à missão em Listra. Lucas provavelmente passa a acompanhar parte do percurso a partir de Trôade, sugerido pelo início do relato em primeira pessoa (At 16:10).","ideia":"O Espírito Santo conduz a missão em meio a mudanças de planos, conflitos e oposição, abrindo novos caminhos para o Evangelho e formando igrejas que precisam amadurecer na fé.","roteiro":["PARTIDA E ÁSIA MENOR: Antioquia da Síria → regiões da Síria e Cilícia → Derbe → Listra → região frígio-gálata e proximidades da Mísia → Trôade.","MACEDÔNIA: Trôade → Samotrácia → Neápolis → Filipos → Anfípolis → Apolônia → Tessalônica → Bereia.","GRÉCIA E RETORNO: Bereia → Atenas → Corinto → Cencreia → Éfeso → Cesareia → subida e saudação à igreja (frequentemente entendida como Jerusalém) → Antioquia da Síria.","Observações: (1) Atos 15:41 cita Síria e Cilícia como regiões atravessadas, mas não enumera todas as cidades; Tarso é frequentemente colocada em mapas por sua posição e ligação com Paulo, porém não é nomeada neste trecho. (2) Atos 16:6–8 apresenta a região frígio-gálata, a Mísia e a tentativa frustrada de entrar na Bitínia; não autoriza traçar com certeza todas as estradas percorridas. (3) Atos 18:22 afirma que Paulo subiu e saudou a igreja; muitos intérpretes identificam a cidade com Jerusalém, mas Lucas não a nomeia explicitamente."]},"paradas":[{"n":1,"titulo":"ANTIOQUIA DA SÍRIA — A PARTIDA E UMA SEPARAÇÃO DIFÍCIL","corpo":["Paulo propôs a Barnabé uma nova visita aos irmãos das cidades evangelizadas. Barnabé desejava levar João Marcos; Paulo não considerava apropriado contar com ele após sua saída anterior na Panfília (At 13:13). A discordância foi forte, e os dois se separaram: Barnabé levou Marcos para Chipre; Paulo escolheu Silas e partiu, confiado pelos irmãos à graça do Senhor."],"listas":[{"t":"Fatos importantes e marcantes","itens":["O propósito inicial era fortalecer discípulos, não apenas abrir novas frentes.","A divergência envolveu a composição da equipe, não um desacordo doutrinário sobre o Evangelho.","Lucas acompanha a jornada de Paulo e Silas; a ida de Barnabé e Marcos a Chipre é outra linha missionária, não uma parada da equipe de Paulo."]},{"t":"Lições bíblicas","itens":["Até obreiros experientes podem discordar gravemente.","O relato descreve o conflito sem torná-lo modelo de divisão."]}],"ref":"At 15:35–40","local":"Antiga Antioquia sobre o Orontes, atual Antakya, Turquia.","aplicacao":"Aprender a lidar com divergências ministeriais com firmeza, humildade, diálogo e preocupação com as pessoas envolvidas.","frase":"A obra de Deus precisa de convicções firmes e relacionamentos tratados com maturidade.","pergunta":"Como lidar com divergências sem transformar diferenças de avaliação em ataques pessoais?"},{"n":2,"titulo":"SÍRIA E CILÍCIA — FORTALECENDO IGREJAS","corpo":["Paulo e Silas atravessaram a Síria e a Cilícia, fortalecendo as igrejas. O texto não oferece uma lista de cidades específicas. A viagem terrestre recorda que o serviço cristão inclui o cuidado contínuo de pessoas que já ouviram o Evangelho."],"listas":[{"t":"Fatos importantes e marcantes","itens":["A expressão “fortalecendo as igrejas” reaparece ao longo da narrativa.","Tarso, cidade natal de Paulo, ficava na Cilícia, mas não é citada nominalmente nesta etapa."]},{"t":"Lições bíblicas","itens":["Consolidar a fé dos discípulos é parte da missão."]}],"ref":"At 15:41","local":"Regiões do norte do Levante e sudeste da atual Turquia.","aplicacao":"Acompanhar alunos, líderes e novos convertidos depois da primeira experiência de aprendizagem ou conversão.","frase":"Uma igreja não amadurece apenas porque começou; ela cresce quando é fortalecida."},{"n":3,"titulo":"DERBE — REVISITANDO OS FRUTOS DA PRIMEIRA VIAGEM","corpo":["Paulo chegou a Derbe e depois a Listra, retomando contatos da viagem anterior. Lucas não descreve um novo episódio extraordinário em Derbe, mas a menção confirma o retorno a territórios onde muitos discípulos haviam sido feitos."],"listas":[{"t":"Fatos importantes e marcantes","itens":["Derbe foi o ponto mais distante da primeira viagem antes do retorno.","A segunda viagem reaproveita e desenvolve vínculos ministeriais anteriores."]},{"t":"Lições bíblicas","itens":["A evangelização e o acompanhamento se complementam."]}],"ref":"At 16:1; cf. 14:20–21","local":"Licaônia, Ásia Menor; localização arqueológica exata debatida.","aplicacao":"Avaliar se o ensino oferecido aos alunos produz continuidade, crescimento e compromisso.","frase":"O verdadeiro fruto não é apenas começar bem, mas permanecer e amadurecer."},{"n":4,"titulo":"LISTRA — A ENTRADA DE TIMÓTEO","corpo":["Em Listra, Paulo encontrou Timóteo, discípulo bem recomendado pelos irmãos de Listra e Icônio. Sua mãe era judia e crente, e seu pai era grego. Paulo desejou levá-lo na missão e o circuncidou por causa dos judeus daquela região, para remover um possível obstáculo à aproximação missionária. Ao longo das cidades, transmitiam as decisões tomadas pelos apóstolos e presbíteros em Jerusalém."],"listas":[{"t":"Fatos importantes e marcantes","itens":["Paulo havia sido apedrejado em Listra na primeira viagem; agora retorna e encontra um futuro cooperador.","A circuncisão de Timóteo não foi apresentada como exigência para salvação: Atos 15 havia rejeitado impor esse requisito aos gentios.","As igrejas eram fortalecidas na fé e cresciam em número (At 16:5)."]},{"t":"Lições bíblicas","itens":["Bom testemunho e discipulado precedem responsabilidades maiores.","É preciso distinguir concessões culturais legítimas de concessões doutrinárias indevidas."]}],"ref":"At 16:1–5; cf. 14:8–20","local":"Região da Licaônia, nas proximidades de Hatunsaray, atual Turquia.","aplicacao":"Formar novos líderes com boa reputação e compreender a diferença entre princípios inegociáveis e adaptações prudentes.","frase":"A missão exige fidelidade doutrinária e sensibilidade cultural.","pergunta":"Por que a atitude de Paulo com Timóteo não contradiz o ensino de Atos 15?"},{"n":5,"titulo":"REGIÃO FRÍGIO-GÁLATA E MÍSIA — PORTAS FECHADAS","corpo":["Os missionários percorreram a região da Frígia e da Galácia, impedidos pelo Espírito Santo de anunciar a Palavra na província romana da Ásia naquele momento. Tentaram seguir em direção à Bitínia, mas o Espírito de Jesus não o permitiu. Passaram então pela Mísia em direção a Trôade."],"listas":[{"t":"Fatos importantes e marcantes","itens":["Ásia, nesse texto, designa uma província romana, não o continente inteiro.","A narrativa não explica o modo específico pelo qual a proibição foi comunicada.","Não se deve concluir que o Evangelho jamais alcançaria essas regiões: Paulo posteriormente ministraria em Éfeso."]},{"t":"Lições bíblicas","itens":["Um impedimento momentâneo não equivale a rejeição definitiva de uma região.","Discernimento espiritual e flexibilidade precisam caminhar juntos."]}],"ref":"At 16:6–8","local":"Regiões interiores e noroeste da Ásia Menor; rota exata discutida.","aplicacao":"Planejar com responsabilidade e permanecer disposto a rever um plano diante de novos fatos e convicções examinadas biblicamente.","frase":"Nem toda porta fechada é derrota; às vezes é um redirecionamento."},{"n":6,"titulo":"TRÔADE — A VISÃO DA MACEDÔNIA","corpo":["Em Trôade, Paulo teve durante a noite a visão de um homem da Macedônia que lhe pedia ajuda. A equipe concluiu que Deus os chamava para anunciar o Evangelho naquela região e procurou partir imediatamente. Nesse ponto aparece a primeira seção narrativa em “nós” no livro de Atos (At 16:10), frequentemente compreendida como sinal da presença de Lucas."],"listas":[{"t":"Fatos importantes e marcantes","itens":["A visão influenciou uma decisão missionária concreta.","O texto diz que a equipe “concluiu” o chamado de Deus, mostrando uma resposta discernida em conjunto.","A presença de Lucas é uma inferência literária plausível, não uma apresentação nominal explícita no versículo."]},{"t":"Lições bíblicas","itens":["A direção divina deve conduzir à obediência prática.","O discernimento pode envolver reflexão e participação de cooperadores."]}],"ref":"At 16:8–10","local":"Cidade portuária no noroeste da atual Turquia.","aplicacao":"Aprender a pesar decisões ministeriais diante das Escrituras, das circunstâncias e de conselhos maduros.","frase":"Quando o propósito fica claro, a obediência não deve ser adiada.","pergunta":"Que cuidados devemos ter para não transformar experiências subjetivas em autoridade superior à Bíblia?"},{"n":7,"titulo":"SAMOTRÁCIA — TRAVESSIA DO MAR EGEU","corpo":["A embarcação partiu de Trôade e seguiu diretamente a Samotrácia, prosseguindo no dia seguinte para Neápolis. Lucas não descreve pregações ou conversões na ilha, que aparece como escala marítima."],"listas":[{"t":"Fatos importantes e marcantes","itens":["A travessia marca a passagem rumo à Macedônia europeia.","Não há indicação de ministério prolongado em Samotrácia."]},{"t":"Lições bíblicas","itens":["A obediência envolve processos e etapas aparentemente comuns."]}],"ref":"At 16:11","local":"Ilha grega no norte do mar Egeu.","aplicacao":"Valorizar o trabalho de preparação e os meios pelos quais a missão se torna possível.","frase":"Também há propósito nos trechos da viagem que parecem silenciosos."},{"n":8,"titulo":"NEÁPOLIS — PORTA DE ENTRADA NA MACEDÔNIA","corpo":["No dia seguinte à escala em Samotrácia, os missionários chegaram a Neápolis e seguiram para Filipos. O relato não atribui a Neápolis uma pregação específica nesta ocasião."],"listas":[{"t":"Fatos importantes e marcantes","itens":["Neápolis servia de acesso marítimo à região macedônica.","A partir dali, a equipe avançou para uma importante colônia romana."]},{"t":"Lições bíblicas","itens":["Estratégias de deslocamento e centros de circulação favorecem a missão."]}],"ref":"At 16:11–12","local":"Porto associado à atual Kavala, Grécia.","aplicacao":"Compreender como infraestrutura, comunicação e tecnologia podem servir à propagação do ensino bíblico.","frase":"O caminho para alcançar pessoas também exige decisões estratégicas."},{"n":9,"titulo":"FILIPOS — LÍDIA, LIBERTAÇÃO E O CARCEREIRO","corpo":["Em Filipos, Paulo e seus companheiros procuraram um lugar de oração junto ao rio. Ali ouviram-nos mulheres, entre elas Lídia, comerciante de púrpura, cujo coração o Senhor abriu para atender à mensagem; ela e sua casa foram batizadas. Depois, Paulo libertou uma jovem que tinha espírito de adivinhação e era explorada economicamente por seus senhores. Os donos, prejudicados em seus lucros, provocaram a prisão e o espancamento de Paulo e Silas. À meia-noite, eles oravam e cantavam. Um terremoto abriu as portas da prisão; o carcereiro, impedido de tirar a própria vida, ouviu o Evangelho, creu e foi batizado com sua casa. Posteriormente, os magistrados foram informados de que os missionários eram cidadãos romanos e buscaram soltá-los discretamente; Paulo exigiu reconhecimento público da injustiça."],"listas":[{"t":"Fatos importantes e marcantes","itens":["Lídia é apresentada como mulher atenta à Palavra, e sua casa oferece hospitalidade.","A libertação da jovem confrontou uma exploração econômica vinculada à adivinhação.","A salvação do carcereiro não é atribuída ao terremoto, mas à fé no Senhor Jesus (At 16:30–34).","A cidadania romana de Paulo foi relevante para denunciar a prisão irregular."]},{"t":"Lições bíblicas","itens":["Deus alcança pessoas de condições sociais muito diferentes.","Louvor e oração podem coexistir com dor e injustiça.","A fé cristã não elimina a responsabilidade de combater abusos de forma legítima."]}],"ref":"At 16:12–40","local":"Antiga colônia romana, próxima à atual Krinides, Grécia.","aplicacao":"Valorizar hospitalidade, dignidade humana, integridade diante da injustiça e perseverança nas provações.","frase":"Portas de ferro podem se fechar, mas o Evangelho continua abrindo corações.","pergunta":"O que une a conversão de Lídia e a do carcereiro, apesar de suas histórias tão diferentes?"},{"n":10,"titulo":"ANFÍPOLIS — ETAPA DA ROTA MACEDÔNICA","corpo":["Depois de sair de Filipos, Paulo e seus companheiros passaram por Anfípolis em direção a Tessalônica. Lucas não relata pregação ou permanência ministerial específica ali."],"listas":[{"t":"Fatos importantes e marcantes","itens":["O caminho acompanhava vias relevantes da Macedônia romana.","A cidade é mencionada como parte da sequência de deslocamentos."]},{"t":"Lições bíblicas","itens":["A narrativa bíblica não precisa apresentar um milagre em cada local para demonstrar a condução da missão."]}],"ref":"At 17:1","local":"Cidade histórica situada na atual Grécia.","aplicacao":"Reconhecer valor no trabalho fiel, inclusive quando seus resultados não são registrados ou conhecidos.","frase":"Nem toda parada deixa uma história escrita; toda fidelidade conta."},{"n":11,"titulo":"APOLÔNIA — CONTINUAÇÃO ATÉ TESSALÔNICA","corpo":["De Anfípolis, o grupo passou por Apolônia e então chegou a Tessalônica. Lucas não descreve acontecimentos particulares nesta cidade durante a passagem."],"listas":[{"t":"Fatos importantes e marcantes","itens":["Apolônia integra o corredor percorrido após Filipos.","Não há base para afirmar que ali se formou uma igreja nesta ocasião."]},{"t":"Lições bíblicas","itens":["O silêncio do texto deve ser respeitado na interpretação."]}],"ref":"At 17:1","local":"Cidade da antiga Macedônia, na atual Grécia.","aplicacao":"Evitar preencher lacunas da Bíblia com afirmações históricas que não podemos demonstrar.","frase":"Ensinar fielmente também é saber dizer: o texto não informa."},{"n":12,"titulo":"TESSALÔNICA — CRISTO ANUNCIADO E OPOSIÇÃO","corpo":["Em Tessalônica havia uma sinagoga. Durante três sábados, Paulo dialogou a partir das Escrituras, demonstrando que o Cristo precisava sofrer e ressuscitar e afirmando que Jesus é o Cristo. Alguns judeus creram, assim como muitos gregos tementes a Deus e mulheres influentes. Outros organizaram tumulto, atacaram a casa de Jasom e acusaram os cristãos de agir contra os decretos de César, proclamando outro rei, Jesus. Os irmãos enviaram Paulo e Silas à noite para Bereia."],"listas":[{"t":"Fatos importantes e marcantes","itens":["A argumentação apostólica utilizava explicação, demonstração e anúncio de Jesus.","A oposição associou a mensagem cristã a uma acusação política.","As cartas aos Tessalonicenses fornecem perspectiva complementar sobre o cuidado pastoral de Paulo."]},{"t":"Lições bíblicas","itens":["Uma exposição bíblica séria pode encontrar tanto fé quanto resistência.","A fé em Cristo tem implicações para a lealdade suprema do discípulo."]}],"ref":"At 17:1–9; cf. 1Ts 1–3","local":"Atual Thessaloniki, Grécia.","aplicacao":"Aprender a fundamentar afirmações em textos bíblicos e responder à oposição sem violência.","frase":"Uma mensagem centrada em Cristo pode transformar vidas e incomodar estruturas.","pergunta":"O que significa argumentar “pelas Escrituras” em vez de apenas repetir opiniões?"},{"n":13,"titulo":"BEREIA — EXAMINANDO DIARIAMENTE AS ESCRITURAS","corpo":["Enviados de Tessalônica, Paulo e Silas chegaram a Bereia e foram à sinagoga. Os ouvintes receberam a mensagem com boa disposição, mas também examinavam diariamente as Escrituras para verificar se o ensino correspondia ao texto. Muitos creram. Judeus vindos de Tessalônica, porém, chegaram para agitar a multidão; Paulo foi então conduzido em direção ao mar, enquanto Silas e Timóteo permaneceram por algum tempo."],"listas":[{"t":"Fatos importantes e marcantes","itens":["A receptividade dos bereanos é elogiada juntamente com o exame cuidadoso das Escrituras.","O relato mostra que acolher uma mensagem e testá-la biblicamente não são atitudes opostas."]},{"t":"Lições bíblicas","itens":["A autoridade final de uma mensagem cristã está na Palavra de Deus.","Alunos maduros não apenas ouvem, mas investigam."]}],"ref":"At 17:10–14","local":"Atual Véria (Veria), Grécia.","aplicacao":"Ler a Bíblia no contexto, conferir referências e cultivar a capacidade de avaliar interpretações.","frase":"A fé madura não teme perguntas; ela examina as Escrituras.","pergunta":"Como praticar discernimento bíblico com respeito aos professores e líderes?"},{"n":14,"titulo":"ATENAS — O ANÚNCIO NO AREÓPAGO","corpo":["Paulo chegou a Atenas e se entristeceu ao observar a cidade repleta de ídolos. Dialogou na sinagoga e na praça, sendo depois conduzido ao Areópago. Falou do Deus que fez o mundo, Senhor do céu e da terra, que não habita em templos feitos por mãos humanas e não depende de cuidados humanos. Usou elementos da cultura dos ouvintes, inclusive referências a seus poetas, para anunciar o Deus verdadeiro, chamar todos ao arrependimento e apontar para o juízo por meio daquele que Deus ressuscitou. Alguns zombaram da ressurreição; outros desejaram ouvi-lo novamente; alguns creram, incluindo Dionísio e Dâmaris."],"listas":[{"t":"Fatos importantes e marcantes","itens":["O discurso parte da criação e da religiosidade local, diferente da abordagem na sinagoga de Tessalônica.","O “deus desconhecido” foi ponto de contato, não aprovação da idolatria.","O sermão termina com arrependimento, juízo e ressurreição, e não apenas uma filosofia religiosa."]},{"t":"Lições bíblicas","itens":["A apologética deve dialogar com a cultura sem se submeter a ela.","Um bom professor sabe fazer pontes entre o conhecimento dos ouvintes e a verdade bíblica."]}],"ref":"At 17:15–34","local":"Atual Atenas, Grécia.","aplicacao":"Desenvolver escuta, argumentação respeitosa e coragem para apresentar aspectos difíceis da fé.","frase":"Dialogar com a cultura não é diluir o Evangelho.","pergunta":"Por que Paulo cita poetas gregos sem aceitar a religião pagã?"},{"n":15,"titulo":"CORINTO — TRABALHO PROLONGADO E PROTEÇÃO DO SENHOR","corpo":["Em Corinto, Paulo conheceu Áquila e Priscila, judeus que haviam vindo da Itália, e trabalhou com eles porque tinham o mesmo ofício de fabricação de tendas ou trabalho relacionado a couro. Anunciava a mensagem na sinagoga. Depois de encontrar oposição, passou a ensinar na casa de Tício Justo, próxima à sinagoga. Crispo, dirigente da sinagoga, creu com sua casa, e muitos coríntios creram e foram batizados. O Senhor encorajou Paulo numa visão a não temer, a continuar falando e a reconhecer sua presença. Paulo permaneceu dezoito meses ensinando a Palavra. Quando foi levado diante do procônsul Gálio, este recusou julgar disputa sobre palavras e leis judaicas. O episódio envolve ainda violência contra Sóstenes, diante do tribunal."],"listas":[{"t":"Fatos importantes e marcantes","itens":["Áquila e Priscila mostram cooperação entre trabalho profissional e serviço cristão.","A presença de uma igreja nascente não significou ausência de conflitos.","A decisão de Gálio é referência importante para estudos cronológicos da viagem.","O relato registra dezoito meses de ensino em Corinto (At 18:11)."]},{"t":"Lições bíblicas","itens":["Deus fortalece seus servos nas situações de medo.","A formação de uma igreja requer ensino perseverante.","O serviço cristão pode caminhar com uma profissão e com trabalho em equipe."]}],"ref":"At 18:1–17; cf. 1Co 2:1–5","local":"Antiga Corinto, na região do Peloponeso, Grécia.","aplicacao":"Perseverar no ensino, evitar dependência de resultados imediatos e valorizar cooperação ministerial.","frase":"A coragem cristã nasce da presença de Deus, não da ausência de oposição.","pergunta":"O que o período prolongado em Corinto ensina sobre profundidade e constância no ensino?"},{"n":16,"titulo":"CENCREIA — PARTIDA E VOTO DE PAULO","corpo":["Após permanecer mais alguns dias em Corinto, Paulo despediu-se dos irmãos e navegou em direção à Síria acompanhado de Priscila e Áquila. Em Cencreia, cortou o cabelo por causa de um voto. O sujeito da ação é geralmente entendido como Paulo, embora discussões exegéticas existam sobre detalhes do voto e sua natureza."],"listas":[{"t":"Fatos importantes e marcantes","itens":["Cencreia foi um porto importante para o embarque.","Atos 18:18 menciona um voto, mas não fornece dados suficientes para definir com certeza todas as suas particularidades."]},{"t":"Lições bíblicas","itens":["Compromissos religiosos devem ser tratados com seriedade, sem construir doutrinas a partir de detalhes omitidos."]}],"ref":"At 18:18","local":"Porto oriental de Corinto, atual região de Kechries, Grécia.","aplicacao":"Distinguir fatos expressos no texto de reconstruções históricas prováveis.","frase":"Uma leitura responsável afirma com segurança apenas aquilo que a Escritura permite afirmar."},{"n":17,"titulo":"ÉFESO — UMA VISITA BREVE E UMA PORTA FUTURA","corpo":["Paulo chegou a Éfeso com Priscila e Áquila, deixou-os ali e entrou na sinagoga para dialogar com os judeus. Embora desejassem que ficasse mais tempo, Paulo não permaneceu; despediu-se expressando a disposição de voltar, se Deus quisesse. Mais adiante, na terceira viagem, Éfeso seria centro de um ministério prolongado (At 19)."],"listas":[{"t":"Fatos importantes e marcantes","itens":["O retorno a Éfeso mostra que a restrição anterior de Atos 16:6 não era necessariamente permanente.","Priscila e Áquila permaneceram como cooperadores importantes; posteriormente ajudariam Apolo (At 18:24–26)."]},{"t":"Lições bíblicas","itens":["A direção de Deus envolve o tempo certo e mudanças de circunstâncias.","Deixar cooperadores preparados também favorece a continuidade da obra."]}],"ref":"At 18:19–21","local":"Costa ocidental da Ásia Menor, próxima à atual Selçuk, Turquia.","aplicacao":"Planejar novas etapas sem impor calendários pessoais à direção de Deus.","frase":"Uma porta pode estar fechada hoje e abrir-se para um trabalho maior amanhã."},{"n":18,"titulo":"CESAREIA — DESEMBARQUE NO RETORNO","corpo":["Paulo desembarcou em Cesareia, cidade portuária da Judeia. Lucas registra, em seguida, que ele “subiu, saudou a igreja” e depois desceu a Antioquia. A maioria dos intérpretes identifica a subida com uma visita a Jerusalém, embora o nome da cidade não apareça explicitamente em At 18:22."],"listas":[{"t":"Fatos importantes e marcantes","itens":["Cesareia era importante ponto de entrada marítima na Judeia.","A referência à subida e à saudação à igreja não deve ser transformada numa descrição detalhada de acontecimentos não narrados."]},{"t":"Lições bíblicas","itens":["O ensino bíblico distingue interpretação provável e afirmação textual direta."]}],"ref":"At 18:22","local":"Cesareia Marítima, litoral de Israel.","aplicacao":"Cultivar precisão histórica e humildade quando uma passagem é sucinta ou ambígua.","frase":"A honestidade exegética fortalece a confiança no ensino."},{"n":19,"titulo":"ANTIOQUIA DA SÍRIA — CHEGADA E ENCERRAMENTO","corpo":["Depois da escala em Cesareia e da subida para saudar a igreja, Paulo desceu a Antioquia. O versículo marca o encerramento da segunda viagem e prepara o relato seguinte. Ao contrário do final da primeira viagem (At 14:26–28), Lucas não descreve aqui uma reunião formal de relatório missionário."],"listas":[{"t":"Fatos importantes e marcantes","itens":["O ponto de chegada liga a viagem à igreja que anteriormente o havia enviado.","At 18:23 inicia uma nova fase de deslocamentos, usualmente chamada terceira viagem missionária."]},{"t":"Lições bíblicas","itens":["O encerramento de um ciclo ministerial pode preparar outro.","É importante não atribuir à segunda viagem relatos da terceira."]}],"ref":"At 18:22","local":"Antioquia sobre o Orontes, atual Antakya, Turquia.","aplicacao":"Avaliar os frutos, aprender com as dificuldades e planejar o próximo ciclo de serviço.","frase":"A missão continua porque a Palavra de Deus continua avançando."}],"lugares":[{"id":"antS","x":1407,"y":505,"nome":"Antioquia da Síria","p":[1,19]},{"id":"cil","x":1290,"y":425,"nome":"Síria e Cilícia","p":[2]},{"id":"der","x":1188,"y":408,"nome":"Derbe","p":[3]},{"id":"lis","x":1075,"y":397,"nome":"Listra","p":[4]},{"id":"fri","x":880,"y":265,"nome":"Frígia, Galácia e Mísia","p":[5]},{"id":"tro","x":577,"y":281,"nome":"Trôade","p":[6]},{"id":"smt","x":494,"y":217,"nome":"Samotrácia","p":[7]},{"id":"nea","x":395,"y":182,"nome":"Neápolis","p":[8]},{"id":"fil","x":358,"y":161,"nome":"Filipos","p":[9]},{"id":"anf","x":318,"y":185,"nome":"Anfípolis","p":[10]},{"id":"apo","x":286,"y":204,"nome":"Apolônia","p":[11]},{"id":"tes","x":286,"y":230,"nome":"Tessalônica","p":[12]},{"id":"ber","x":211,"y":264,"nome":"Bereia","p":[13]},{"id":"ate","x":325,"y":456,"nome":"Atenas","p":[14]},{"id":"cor","x":283,"y":477,"nome":"Corinto","p":[15]},{"id":"cen","x":295,"y":490,"nome":"Cencreia","p":[16]},{"id":"efe","x":654,"y":463,"nome":"Éfeso","p":[17]},{"id":"ces","x":1272,"y":759,"nome":"Cesareia","p":[18]},{"id":"jer","x":1272,"y":860,"nome":"Jerusalém (subida à igreja)","p":[18]}],"trechos":{"2":[[1407,505],[1404,505],[1401,502],[1396,502],[1332,438],[1322,434],[1312,426],[1302,426],[1296,424],[1290,425]],"3":[[1290,425],[1287,422],[1272,420],[1210,420],[1199,409],[1188,408]],"4":[[1188,408],[1154,402],[1080,402],[1075,397]],"5":[[1075,397],[1075,394],[1049,368],[1040,363],[1017,359],[980,322],[976,322],[936,284],[914,274],[901,271],[886,271],[880,265]],"6":[[880,265],[864,268],[852,268],[839,272],[762,272],[757,277],[718,277],[694,287],[669,292],[588,292],[577,281]],"7":[[577,281],[572,265],[571,249],[546,224],[522,213],[498,213],[494,217]],"8":[[494,217],[478,214],[453,214],[441,211],[427,203],[412,199],[395,182]],"9":[[395,182],[376,179],[358,161]],"10":[[358,161],[339,164],[318,185]],"11":[[318,185],[303,187],[286,204]],"12":[[286,204],[286,230]],"13":[[286,230],[279,235],[273,235],[270,237],[240,237],[211,264]],"14":[[211,264],[214,280],[214,291],[241,325],[249,340],[253,354],[267,368],[267,413],[303,449],[313,449],[318,454],[323,454],[325,456]],"15":[[325,456],[316,459],[308,467],[300,470],[290,470],[283,477]],"16":[[283,477],[283,479],[295,490]],"17":[[295,490],[348,490],[359,501],[521,503],[579,484],[599,475],[612,474],[620,468],[636,468],[654,463]],"18":[[654,463],[658,486],[663,493],[664,500],[669,506],[670,512],[682,538],[711,567],[711,575],[756,620],[775,636],[812,661],[852,682],[901,704],[961,726],[1014,741],[1069,753],[1104,759],[1165,765],[1263,765],[1272,759]],"19":[[1272,759],[1274,744],[1278,735],[1304,699],[1315,669],[1329,655],[1329,632],[1349,595],[1358,553],[1407,505]]}},"v3":{"aba":"3ª viagem","titulo":"A Terceira Viagem Missionária","w":1671,"h":941,"meta":{"texto":"Atos 18:23–21:17.","ideia":"A terceira viagem evidencia uma missão voltada ao ensino perseverante, à formação de discípulos e líderes, à integridade pastoral e à obediência a Cristo apesar dos riscos pessoais.","roteiro":["ETAPA 1 — INTERIOR DA ÁSIA MENOR: Antioquia da Síria → região da Galácia → região da Frígia → Éfeso.","ETAPA 2 — MACEDÔNIA E GRÉCIA: Éfeso → Macedônia (cidades não especificadas nessa etapa; Filipos aparece no retorno) → Grécia/Acaia (provável permanência em Corinto, embora Atos 20:2–3 não nomeie a cidade).","ETAPA 3 — REGRESSO PELO EGEU: Macedônia/Filipos → Trôade → Assôs → Mitilene → proximidades de Quios → Samos → Mileto.","ETAPA 4 — REGRESSO PELO MEDITERRÂNEO ORIENTAL: Mileto → Cós → Rodes → Pátara → passagem ao sul de Chipre → Tiro → Ptolemaida → Cesareia → Jerusalém.","Nota de precisão: Galácia, Frígia, Macedônia e Grécia são regiões; Quios e Chipre são referidos como referências de navegação, sem relato de desembarque nessa etapa. O texto bíblico não enumera cada parada intermediária, especialmente nas viagens terrestres."]},"paradas":[{"n":1,"titulo":"ANTIOQUIA DA SÍRIA — O NOVO INÍCIO","corpo":["Após passar algum tempo em Antioquia, Paulo parte novamente. Lucas não registra nesta ocasião uma nova cerimônia de separação semelhante à de Atos 13:1–3."],"listas":[],"ref":"Atos 18:22–23","local":"Cidade da Síria romana e base missionária anterior de Paulo.","licao":"A constância no serviço cristão inclui revisitar e fortalecer aquilo que já foi iniciado.","aplicacao":"Reflita sobre trabalhos que você começou e que precisam de continuidade, e não apenas de novas iniciativas.","frase":"A maturidade ministerial não busca somente começar bem; procura continuar fiel."},{"n":2,"titulo":"GALÁCIA E FRÍGIA — FORTALECENDO DISCÍPULOS","corpo":["Paulo percorre sucessivamente essas regiões, fortalecendo todos os discípulos. O texto enfatiza a atenção aos já convertidos."],"listas":[],"ref":"Atos 18:23","local":"Regiões interiores da Ásia Menor, na atual Turquia; Lucas não identifica as cidades desta travessia.","licao":"A missão inclui acompanhamento, ensino e consolidação espiritual, não apenas primeiras decisões de fé.","aplicacao":"Pense em maneiras práticas de acompanhar recém-convertidos: leitura bíblica, oração, ensino e relacionamento pastoral.","frase":"O cuidado com as pessoas não termina quando elas recebem a mensagem."},{"n":3,"titulo":"ÉFESO — O EVANGELHO E A FORMAÇÃO DE DISCÍPULOS","corpo":["Paulo encontra cerca de doze homens que conheciam o batismo de João; explica-lhes a centralidade de Jesus. Eles recebem o batismo em nome do Senhor Jesus e o Espírito Santo. Paulo ensina por três meses na sinagoga; diante da resistência, passa a ensinar diariamente na escola de Tirano por dois anos. Segundo At 20:31, seu cuidado pela igreja se estendeu por cerca de três anos."],"listas":[],"ref":"Atos 19:1–10; 20:31","local":"Importante cidade portuária e comercial da província romana da Ásia, na atual Turquia.","licao":"O ensino bíblico sistemático é fundamental para amadurecer a fé. Atos 19 relata uma situação particular de transição na história da salvação; não deve ser reduzida a uma fórmula rígida sobre toda experiência cristã.","aplicacao":"Diferencie entusiasmo inicial de formação sólida na Palavra. Planeje estudos contínuos e oportunidades de perguntas.","frase":"O Evangelho não exige somente ouvintes; forma discípulos que conhecem a verdade."},{"n":4,"titulo":"ÉFESO — PODER DE DEUS, ARREPENDIMENTO E DISCERNIMENTO","corpo":["Deus realiza milagres extraordinários por meio de Paulo. Alguns exorcistas itinerantes tentam usar o nome de Jesus como fórmula e são desmoralizados. Muitos crentes confessam práticas anteriores, e pessoas envolvidas com magia queimam livros de grande valor."],"listas":[],"ref":"Atos 19:11–20","local":"O mesmo período da longa permanência de Paulo em Éfeso.","licao":"O nome de Jesus não é uma técnica religiosa. A fé genuína produz arrependimento e ruptura com práticas incompatíveis com o Evangelho.","aplicacao":"Examine se alguma prática espiritual foi transformada em superstição ou instrumento de manipulação.","frase":"Não se usa o nome de Cristo como fórmula; vive-se debaixo do seu senhorio."},{"n":5,"titulo":"ÉFESO — O TUMULTO DOS ARTÍFICES","corpo":["Demétrio, fabricante de objetos associados ao culto de Ártemis, mobiliza artífices temerosos da perda de renda e prestígio. O tumulto toma a cidade; o escrivão municipal consegue dispersar a assembleia. O episódio mostra efeitos sociais e econômicos da expansão do Evangelho."],"listas":[],"ref":"Atos 19:21–41","local":"Éfeso abrigava o conhecido culto a Ártemis, ligado também à economia local.","licao":"O Evangelho pode desafiar estruturas de idolatria e interesses estabelecidos, sem autorizar violência ou desordem.","aplicacao":"Discuta como convicções cristãs podem transformar hábitos de consumo, ética profissional e prioridades econômicas.","frase":"Quando a verdade transforma vidas, também questiona os ídolos de uma sociedade."},{"n":6,"titulo":"MACEDÔNIA — ENCORAJAMENTO NAS IGREJAS","corpo":["Depois do tumulto, Paulo se despede dos discípulos, parte para a Macedônia e percorre a região encorajando os irmãos com muitas palavras. As cartas paulinas oferecem informações complementares, mas Atos não enumera todas as cidades visitadas nesta passagem."],"listas":[],"ref":"Atos 20:1–2; 2 Coríntios 2:12–13; 7:5–7","local":"Região do norte da Grécia atual, que incluía igrejas como Filipos e Tessalônica.","licao":"O encorajamento é parte essencial da liderança pastoral; igrejas precisam ser instruídas e animadas nas dificuldades.","aplicacao":"Pratique o encorajamento com base nas promessas bíblicas, não apenas em palavras de entusiasmo.","frase":"Uma igreja fortalecida precisa de verdade ensinada e esperança renovada."},{"n":7,"titulo":"GRÉCIA (ACAIA) — TRÊS MESES E UMA MUDANÇA DE PLANO","corpo":["Paulo permanece três meses na Grécia. Quando planeja embarcar rumo à Síria, descobre uma conspiração contra si e decide voltar pela Macedônia. A associação com a redação de Romanos e a preparação da coleta para Jerusalém é amplamente aceita, mas depende da reconstrução histórica entre Atos e as cartas."],"listas":[],"ref":"Atos 20:2–3; Romanos 15:25–27; 16:1–2","local":"Região meridional da Grécia; Corinto é geralmente considerada a principal base provável dessa permanência.","licao":"Planejamento e prudência podem coexistir com plena confiança em Deus. Também se destaca a solidariedade entre igrejas por meio da oferta.","aplicacao":"Organize os projetos com flexibilidade e considere o auxílio concreto a irmãos em necessidade.","frase":"Fidelidade à missão não é rigidez de rota: é perseverança no propósito."},{"n":8,"titulo":"FILIPOS — A PARTIDA APÓS A PÁSCOA","corpo":["Paulo e seus companheiros navegam de Filipos depois dos dias dos pães asmos. A travessia até Trôade leva cinco dias; permanecem ali sete dias. Atos 20:4–5 menciona vários cooperadores e a divisão do grupo antes do encontro em Trôade."],"listas":[],"ref":"Atos 20:3–6","local":"Cidade macedônica; ponto explicitamente mencionado na volta.","licao":"A missão era uma obra compartilhada; pessoas com procedências distintas colaboravam com o mesmo Evangelho.","aplicacao":"Identifique dons complementares em sua igreja e aprenda a servir em equipe.","frase":"Uma missão robusta não depende da força de uma pessoa, mas de cooperadores fiéis."},{"n":9,"titulo":"TRÔADE — ÊUTICO E A REUNIÃO DOS DISCÍPULOS","corpo":["No primeiro dia da semana, os discípulos estão reunidos para partir o pão. Paulo prolonga a conversa até a meia-noite. Êutico adormece sentado à janela do terceiro andar, cai e é levantado morto; Paulo o abraça e afirma que sua vida está nele. O jovem é levado vivo e todos ficam grandemente consolados."],"listas":[],"ref":"Atos 20:5–12","local":"Cidade portuária no noroeste da Ásia Menor.","licao":"A passagem destaca a reunião dos discípulos, o ensino da Palavra e a consolação divina. O milagre não deve ser convertido em norma ou técnica reproduzível.","aplicacao":"Valorize a reunião cristã e o ensino, mas cuide também das condições práticas e do bem-estar dos ouvintes.","frase":"Ensinar a Palavra e cuidar das pessoas pertencem à mesma missão."},{"n":10,"titulo":"ASSÔS — A CAMINHADA DE PAULO","corpo":["Os companheiros seguem de navio para Assôs, enquanto Paulo decide fazer o trecho por terra. Ali ele embarca com o grupo. O texto não explica por que escolheu caminhar."],"listas":[],"ref":"Atos 20:13–14","local":"Cidade portuária da costa do Egeu, na atual Turquia.","licao":"Nem todos os motivos de uma decisão são revelados pela narrativa; a interpretação fiel reconhece os limites do texto.","aplicacao":"Evite transformar suposições sobre personagens bíblicos em ensinamentos obrigatórios.","frase":"A boa interpretação também sabe dizer: o texto não informa."},{"n":11,"titulo":"MITILENE — CONTINUIDADE DO RETORNO","corpo":["Depois de acolherem Paulo a bordo em Assôs, os missionários seguem até Mitilene. Lucas não registra pregação ou incidentes ali."],"listas":[],"ref":"Atos 20:14","local":"Cidade da ilha de Lesbos, no Egeu.","licao":"Há etapas de deslocamento que sustentam a missão mesmo sem eventos extraordinários registrados.","aplicacao":"Reconheça a importância das tarefas discretas de organização e suporte ao ministério.","frase":"A fidelidade também se manifesta nas etapas silenciosas."},{"n":12,"titulo":"QUIOS — PASSAGEM JUNTO À ILHA","corpo":["No dia seguinte, o navio chega diante de Quios; a passagem não afirma que o grupo desembarcou na ilha."],"listas":[],"ref":"Atos 20:15","local":"Ilha do mar Egeu.","licao":"A leitura cuidadosa diferencia um ponto de referência náutica de uma efetiva visita missionária.","aplicacao":"Ao preparar aulas e mapas, não acrescente fatos que o texto não descreve.","frase":"Precisão bíblica é respeito pelo que Deus escolheu revelar."},{"n":13,"titulo":"SAMOS — ETAPA DE NAVEGAÇÃO","corpo":["O navio chega a Samos; algumas tradições textuais mencionam também Trógilio, detalhe que varia entre manuscritos/traduções. Em seguida seguem para Mileto."],"listas":[],"ref":"Atos 20:15","local":"Ilha do Egeu, próxima à costa da Ásia Menor.","licao":"Variações textuais menores exigem consulta cuidadosa às traduções, sem alterar o sentido geral do itinerário.","aplicacao":"Aprenda a verificar notas textuais de uma boa Bíblia de estudo antes de afirmar pormenores.","frase":"O rigor com os detalhes fortalece a confiança na exposição bíblica."},{"n":14,"titulo":"MILETO — O DISCURSO AOS PRESBÍTEROS","corpo":["Paulo decide passar ao largo de Éfeso para não se demorar na Ásia e, de Mileto, convoca os presbíteros daquela igreja. Recorda sua vida de humildade, lágrimas, ensino público e de casa em casa; proclama arrependimento e fé; adverte sobre falsos mestres; recomenda a igreja a Deus e à Palavra da graça; defende trabalho honesto e cuidado dos fracos. A despedida é marcada por oração, choro e afeto."],"listas":[],"ref":"Atos 20:15–38","local":"Porto da costa da Ásia Menor, ao sul de Éfeso.","licao":"A liderança cristã exige integridade, vigilância doutrinária, serviço sacrificial e fidelidade à Palavra. Atos 20:28 relaciona supervisão pastoral à igreja adquirida por Deus mediante o sangue de Cristo.","aplicacao":"Compare seu modelo de liderança com o testemunho de Paulo: caráter, conteúdo do ensino, cuidado pessoal e generosidade.","frase":"Um pastor fiel protege o rebanho com a verdade e o serve com a própria vida."},{"n":15,"titulo":"CÓS — A PRIMEIRA ESCALA APÓS MILETO","corpo":["Depois da despedida em Mileto, os viajantes navegam diretamente para Cós. Lucas não relata atividade missionária nessa escala."],"listas":[],"ref":"Atos 21:1","local":"Ilha do mar Egeu, hoje Grécia.","licao":"A narrativa bíblica intercala grandes discursos e deslocamentos cotidianos.","aplicacao":"Perceba a continuidade do chamado mesmo em deslocamentos e períodos de transição.","frase":"O propósito permanece quando o cenário muda."},{"n":16,"titulo":"RODES — A SEQUÊNCIA DA TRAVESSIA","corpo":["De Cós, seguem para Rodes, parada marítima registrada resumidamente."],"listas":[],"ref":"Atos 21:1","local":"Ilha no sudeste do Egeu, hoje Grécia.","licao":"É preciso distinguir o que é dado histórico do que seria apenas reconstrução imaginativa.","aplicacao":"Ao ensinar geografia bíblica, use o mapa como apoio da narrativa, não como substituto do texto.","frase":"O professor responsável não preenche silêncios com certezas inventadas."},{"n":17,"titulo":"PÁTARA — TROCA DE EMBARCAÇÃO","corpo":["Em Pátara, encontram um navio que seguiria para a Fenícia, embarcam e prosseguem viagem."],"listas":[],"ref":"Atos 21:1–2","local":"Porto da antiga Lícia, no sul da atual Turquia.","licao":"Deus conduz sua obra em meio a decisões práticas e recursos ordinários.","aplicacao":"Associe oração e discernimento com logística responsável ao planejar iniciativas ministeriais.","frase":"A direção espiritual não elimina decisões práticas."},{"n":18,"titulo":"CHIPRE — AVISTADA DURANTE A NAVEGAÇÃO","corpo":["A tripulação avista Chipre, deixa-a à esquerda e navega para a Síria. O relato não indica desembarque nessa passagem."],"listas":[],"ref":"Atos 21:3","local":"Ilha do Mediterrâneo oriental.","licao":"A exatidão da leitura protege o aluno de confundir rota marítima com presença efetiva na localidade.","aplicacao":"Desenvolva hábito de comparar mapas históricos e a redação dos versículos.","frase":"Um detalhe geográfico também ensina a ler com atenção."},{"n":19,"titulo":"TIRO — ORAÇÃO E DESPEDIDA NA PRAIA","corpo":["O navio descarrega sua carga em Tiro. Paulo encontra discípulos e permanece sete dias. Por meio do Espírito, eles o alertam a respeito de Jerusalém. Ao partir, homens, mulheres e crianças acompanham a equipe até a praia, onde todos se ajoelham e oram."],"listas":[],"ref":"Atos 21:3–6","local":"Porto fenício, na atual costa do Líbano.","licao":"A comunhão cristã transpassa gerações. É preciso distinguir o aviso espiritual sobre sofrimento da decisão de Paulo de seguir em obediência (cf. At 20:22–23; 21:10–14).","aplicacao":"Aprenda a acolher conselhos, orar em conjunto e discernir com responsabilidade a vontade de Deus.","frase":"A fraternidade aparece quando a igreja ora junta diante de despedidas difíceis."},{"n":20,"titulo":"PTOLEMAIDA — UMA VISITA AOS IRMÃOS","corpo":["Concluída a navegação desde Tiro, Paulo e seus companheiros saúdam os irmãos e permanecem um dia com eles."],"listas":[],"ref":"Atos 21:7","local":"Cidade costeira conhecida hoje como Acre (Akko), em Israel.","licao":"Vínculos entre igrejas locais fortaleciam a rede de apoio da missão apostólica.","aplicacao":"Valorize a hospitalidade e os encontros que edificam o corpo de Cristo.","frase":"Uma breve visita pode deixar encorajamento duradouro."},{"n":21,"titulo":"CESAREIA MARÍTIMA — FILIPE E A PROFECIA DE ÁGABO","corpo":["Paulo hospeda-se na casa de Filipe, o evangelista, um dos sete de Atos 6; suas quatro filhas profetizavam. Ágabo anuncia, por gesto simbólico com o cinto de Paulo, que ele seria preso em Jerusalém e entregue aos gentios. Os irmãos suplicam que Paulo não vá; ele afirma estar pronto até para morrer pelo nome de Jesus. Ao final, dizem: “Faça-se a vontade do Senhor”."],"listas":[],"ref":"Atos 21:8–14","local":"Cidade portuária da costa mediterrânea da Judeia, em Israel.","licao":"A coragem cristã não é ausência de emoção: Paulo reconhece a dor dos irmãos, mas se mantém disposto a obedecer. As palavras proféticas e os conselhos precisam ser lidos no contexto de toda a narrativa.","aplicacao":"Reflita sobre a relação entre a preocupação legítima dos irmãos e a fidelidade a uma convicção de chamado.","frase":"A fidelidade a Cristo vale mais do que a segurança das circunstâncias."},{"n":22,"titulo":"JERUSALÉM — A CHEGADA","corpo":["Depois de preparar as bagagens, o grupo sobe de Cesareia a Jerusalém. Alguns discípulos acompanham os viajantes, e os irmãos recebem Paulo com alegria. Atos 21:17 encerra a etapa da terceira viagem; os eventos posteriores dizem respeito à visita, prisão e caminho rumo a Roma."],"listas":[],"ref":"Atos 21:15–17","local":"Jerusalém, centro histórico da igreja nascente.","licao":"O cumprimento do propósito missionário pode conduzir a novos desafios, não necessariamente ao descanso ou ao reconhecimento público.","aplicacao":"Avalie sua disposição de seguir obedecendo mesmo quando o próximo capítulo é incerto.","frase":"A obediência não termina na chegada; ela continua no próximo chamado."}],"lugares":[{"id":"antS","x":1405,"y":439,"nome":"Antioquia da Síria","p":[1]},{"id":"gal","x":1110,"y":275,"nome":"Galácia e Frígia","p":[2]},{"id":"efe","x":652,"y":466,"nome":"Éfeso","p":[3,4,5]},{"id":"mac","x":205,"y":300,"nome":"Macedônia","p":[6]},{"id":"gre","x":224,"y":472,"nome":"Grécia (Corinto)","p":[7]},{"id":"fil","x":323,"y":162,"nome":"Filipos","p":[8]},{"id":"tro","x":580,"y":257,"nome":"Trôade","p":[9]},{"id":"ass","x":571,"y":303,"nome":"Assôs","p":[10]},{"id":"mit","x":581,"y":356,"nome":"Mitilene","p":[11]},{"id":"qui","x":530,"y":424,"nome":"Quios","p":[12]},{"id":"sam","x":596,"y":495,"nome":"Samos","p":[13]},{"id":"mil","x":607,"y":535,"nome":"Mileto","p":[14]},{"id":"cos","x":630,"y":599,"nome":"Cós","p":[15]},{"id":"rod","x":648,"y":641,"nome":"Rodes","p":[16]},{"id":"pat","x":764,"y":665,"nome":"Pátara","p":[17]},{"id":"chi","x":1110,"y":712,"nome":"Chipre (avistada)","p":[18]},{"id":"tir","x":1283,"y":721,"nome":"Tiro","p":[19]},{"id":"pto","x":1273,"y":759,"nome":"Ptolemaida","p":[20]},{"id":"ces","x":1257,"y":801,"nome":"Cesareia","p":[21]},{"id":"jer","x":1279,"y":861,"nome":"Jerusalém","p":[22]}],"trechos":{"2":[[1405,439],[1390,418],[1388,411],[1388,380],[1343,336],[1321,336],[1314,333],[1258,333],[1227,309],[1211,307],[1176,307],[1160,300],[1151,292],[1135,283],[1128,281],[1116,281],[1110,275]],"3":[[1110,275],[1081,275],[1075,277],[1010,342],[945,342],[930,346],[915,353],[864,404],[846,415],[831,419],[728,419],[704,430],[692,442],[687,444],[674,443],[670,447],[670,454],[652,466]],"6":[[652,466],[652,436],[658,422],[702,378],[706,371],[709,359],[709,312],[694,297],[678,289],[650,283],[597,282],[583,268],[583,260],[573,250],[568,250],[546,230],[529,221],[513,216],[445,207],[394,195],[365,184],[339,170],[334,169],[330,165],[296,165],[281,180],[266,187],[228,225],[221,238],[218,248],[215,290],[205,300]],"7":[[205,300],[205,355],[197,365],[192,378],[192,402],[206,416],[206,454],[224,472]],"8":[[224,472],[223,458],[185,420],[185,401],[181,394],[180,388],[180,349],[193,333],[196,324],[197,240],[228,209],[241,200],[267,190],[284,181],[289,176],[298,176],[313,164],[321,164],[323,162]],"9":[[323,162],[326,162],[329,165],[342,166],[377,184],[400,192],[412,194],[430,211],[507,211],[532,217],[543,222],[580,257]],"10":[[580,257],[577,280],[572,289],[566,295],[567,299],[571,303]],"11":[[571,303],[576,332],[576,343],[579,346],[579,354],[581,356]],"12":[[581,356],[578,366],[548,396],[545,404],[530,424]],"13":[[530,424],[530,427],[533,430],[533,435],[596,495]],"14":[[596,495],[596,498],[599,501],[599,522],[603,526],[603,531],[607,535]],"15":[[607,535],[607,538],[610,541],[610,556],[617,567],[617,573],[621,579],[622,587],[630,599]],"16":[[630,599],[633,620],[646,633],[646,639],[648,641]],"17":[[648,641],[663,643],[673,652],[702,663],[752,663],[754,665],[764,665]],"18":[[764,665],[767,665],[772,670],[778,670],[787,679],[815,694],[845,703],[865,706],[873,714],[1110,715],[1110,712]],"19":[[1110,712],[1110,715],[1272,715],[1283,721]],"20":[[1283,721],[1280,746],[1275,751],[1275,757],[1273,759]],"21":[[1273,759],[1270,778],[1267,785],[1261,792],[1261,797],[1257,801]],"22":[[1257,801],[1261,833],[1265,843],[1275,853],[1275,857],[1279,861]]}},"v4":{"aba":"Rumo a Roma","titulo":"A Viagem de Paulo a Roma","w":1671,"h":941,"meta":{"texto":"Atos 21:17–28:31. Narrativa da viagem marítima: Atos 27:1–28:16. Permanência em Roma: Atos 28:17–31.","equipe":"Paulo, Lucas e outros companheiros, o centurião Júlio, Félix, Festo, Agripa II, Aristarco, os marinheiros e soldados, Públio e os irmãos encontrados ao longo da rota.","ideia":"A condução de Paulo a Roma, embora ocorrida sob custódia romana, revela a soberania de Deus, a perseverança do apóstolo e o avanço da Palavra em meio a injustiças, perigos e limitações.","roteiro":["PRÓLOGO JUDICIAL: Jerusalém → Cesareia Marítima (prisão, audiências e apelação a César).","NAVEGAÇÃO INICIAL: Cesareia → Sidom → ao abrigo de Chipre → Mira, na Lícia → diante de Cnido → costa sul de Creta, passando por Salmona → Bons Portos (perto de Laseia).","TEMPESTADE E NAUFRÁGIO: tentativa frustrada de alcançar Fenice/Fênix → ao abrigo da ilha de Cauda/Clauda → deriva no mar → naufrágio em Malta.","ROTA FINAL: Malta → Siracusa → Régio → Putéoli → encontro com irmãos na Praça de Ápio e nas Três Vendas → Roma.","Atenção: Fenice era um porto pretendido, mas não alcançado (At 27:12). Cnido e Salmona são marcos da navegação, não paradas comprovadas. Cauda foi uma ilha sob cujo abrigo o navio passou; o texto não descreve desembarque ali. Em Atos 27, vento e correntes impediram um roteiro linear. Algumas identificações antigas são aproximadas e certos detalhes da navegação permanecem debatidos."]},"paradas":[{"n":1,"titulo":"Jerusalém: chegada, prisão e testemunho","corpo":["Paulo relata a obra de Deus entre os gentios aos líderes da igreja. Em meio a rumores e tensões, visita o templo; judeus da Ásia o acusam e provocam um tumulto. A intervenção de soldados romanos impede sua morte imediata. Paulo fala ao povo, explica sua conversão e é posteriormente levado perante o Sinédrio. A narrativa mostra tanto a seriedade dos conflitos quanto as oportunidades de testemunho criadas em situações adversas.","Atos 23:11 registra o encorajamento do Senhor a Paulo e antecipa seu testemunho em Roma."],"listas":[],"ref":"Atos 21:17–23:11","local":"Jerusalém, atual Israel","destaque":"Paulo é acolhido pelos irmãos, enfrenta um tumulto no templo, é detido e apresenta sua defesa.","licao":"A fidelidade a Cristo não garante ausência de injustiça. Mesmo numa prisão, a esperança do Evangelho pode ser anunciada.","aplicacao":"Quando surgirem acusações ou conflitos, precisamos responder com verdade, prudência e consciência limpa, sem abandonar a missão.","frase":"Uma crise pode interromper nossos planos, mas não cancela a fidelidade de Deus."},{"n":2,"titulo":"Cesareia Marítima: proteção, julgamentos e apelação","corpo":["Após uma conspiração contra sua vida, Paulo é escoltado até Cesareia. Diante do governador Félix (At 24), responde às acusações; fica sob custódia por cerca de dois anos. Com a sucessão de Festo, novas pressões surgem. Paulo, cidadão romano, apela para César (At 25:10–12). Diante do rei Agripa II, apresenta o testemunho de sua conversão, a esperança da ressurreição e a mensagem anunciada aos judeus e gentios (At 26).","A apelação a César explica o transporte do prisioneiro a Roma; Lucas não relata o resultado do julgamento imperial."],"listas":[],"ref":"Atos 23:12–26:32","local":"Porto romano de Cesareia, costa de Israel","destaque":"Paulo é transferido para segurança e comparece diante de Félix, Festo e Agripa II.","licao":"Deus pode usar meios jurídicos e autoridades civis para proteger seus servos e abrir espaços de testemunho, sem que isso torne justas todas as decisões humanas.","aplicacao":"O cristão pode exercer legitimamente direitos civis e deve estar preparado para explicar sua fé com respeito, clareza e consistência bíblica.","frase":"Defender a fé também exige saber explicar por que cremos."},{"n":3,"titulo":"Partida de Cesareia: sob custódia romana","corpo":["A equipe de viagem inclui o centurião Júlio, soldados, Paulo e outros prisioneiros. A forma narrativa “nós” reaparece, indicando a participação do narrador na viagem; Aristarco, macedônio de Tessalônica, também é citado. O primeiro navio deveria passar por portos da costa da Ásia."],"listas":[],"ref":"Atos 27:1–2","local":"Cesareia Marítima → mar Mediterrâneo","destaque":"Paulo e outros presos são entregues ao centurião Júlio e embarcam em navio de Adramítio.","licao":"Mesmo quando não controla as circunstâncias, o discípulo continua responsável por sua conduta e testemunho.","aplicacao":"Aprender a viver com integridade nas situações impostas pela vida, sem fazer da falta de controle desculpa para desistir.","frase":"Não controlar o trajeto não significa caminhar sem propósito."},{"n":4,"titulo":"Sidom: uma parada de cuidado","corpo":["No dia seguinte à partida, o navio faz escala em Sidom. Lucas descreve uma atitude bondosa do centurião, que permite a Paulo encontrar seus amigos e receber assistência. A cena revela uma rede de relações fraternas que sustentava o apóstolo durante as dificuldades."],"listas":[],"ref":"Atos 27:3","local":"Sidom, atual Líbano","destaque":"Júlio permite que Paulo visite amigos e receba cuidados.","licao":"A providência divina também se expressa em atos concretos de bondade e amizade.","aplicacao":"Visitar, acolher e suprir necessidades são formas valiosas de participar do serviço cristão.","frase":"Às vezes, a maior ajuda não é um discurso, mas uma presença cuidadosa."},{"n":5,"titulo":"Navegação ao abrigo de Chipre","corpo":["A embarcação navega ao abrigo de Chipre e atravessa os mares diante da Cilícia e da Panfília. Lucas não registra uma parada em porto cipriota nessa etapa; descreve a manobra destinada a enfrentar os ventos contrários."],"listas":[],"ref":"Atos 27:4–5","local":"Ao norte/leste da ilha de Chipre; mar da Cilícia e Panfília","destaque":"Os ventos contrários obrigam a mudar a rota marítima.","licao":"A realidade das dificuldades exige discernimento e adaptação sem abandono do objetivo.","aplicacao":"Planejar não é negar os imprevistos; maturidade é ajustar meios sem negociar princípios.","frase":"A direção permanece firme, mesmo quando a rota precisa mudar."},{"n":6,"titulo":"Mira da Lícia: troca de embarcação","corpo":["A troca de navio marca um passo importante no percurso. A embarcação alexandrina era adequada a viagens longas no Mediterrâneo. O texto não especifica sua carga nesse ponto, embora posteriormente mencione trigo (At 27:38)."],"listas":[],"ref":"Atos 27:5–6","local":"Mira, próxima à atual Demre, Turquia","destaque":"Júlio encontra um navio de Alexandria que seguia para a Itália e transfere os passageiros.","licao":"Deus pode conduzir etapas decisivas por meio de decisões e estruturas ordinárias da vida.","aplicacao":"Devemos reconhecer a importância da logística, da cooperação e do cuidado com recursos nas atividades ministeriais.","frase":"A fidelidade também se demonstra nas decisões práticas."},{"n":7,"titulo":"Diante de Cnido: ventos que impedem o avanço","corpo":["Após muitos dias de navegação penosa, o navio chega com dificuldade diante de Cnido. Como não é possível prosseguir na direção inicialmente desejada, segue ao abrigo de Creta. Lucas não afirma que os viajantes desembarcaram em Cnido."],
