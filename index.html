"listas":[],"ref":"Atos 27:7","local":"Nas proximidades de Cnido, sudoeste da atual Turquia","destaque":"A navegação avança lentamente e os ventos impedem o rumo desejado.","licao":"Nem todo atraso indica fracasso; reconhecer limites pode preservar vidas.","aplicacao":"O aluno e o líder precisam desenvolver paciência quando o ritmo real é diferente do planejado.","frase":"Uma demora não significa que Deus perdeu o controle."},{"n":8,"titulo":"Salmona e a costa meridional de Creta","corpo":["O navio busca proteção dos ventos contornando Creta. Salmona funciona como referência geográfica no relato. A expressão “com dificuldade” revela que a jornada já era arriscada antes da grande tempestade."],"listas":[],"ref":"Atos 27:7–8","local":"Extremidade oriental de Creta e sua costa sul, Grécia","destaque":"A embarcação passa com dificuldade ao largo de Salmona e costeia a ilha.","licao":"O relato bíblico é realista sobre esforço humano, perigos naturais e perseverança.","aplicacao":"A fé cristã não nos isenta de conhecer limites técnicos, ouvir especialistas e agir com cautela.","frase":"Reconhecer o perigo é sinal de prudência, não de incredulidade."},{"n":9,"titulo":"Bons Portos, perto de Laseia: o aviso de Paulo","corpo":["A estação de navegação tornara-se perigosa; Lucas menciona que o Jejum já havia passado, referência geralmente associada ao Dia da Expiação judaico. Paulo adverte sobre grandes danos e perdas, mas o centurião dá mais crédito ao piloto e ao proprietário do navio. Como o porto não parecia adequado para passar o inverno, decidem tentar alcançar Fenice, também em Creta. Fenice foi destino planejado, não parada realizada."],"listas":[],"ref":"Atos 27:8–12","local":"Bons Portos (Fair Havens), próximo de Laseia, sul de Creta","destaque":"Paulo alerta para os riscos de prosseguir, mas a maioria decide buscar outro porto.","licao":"A sabedoria exige ponderar riscos; decisões por maioria não tornam automaticamente certa uma avaliação.","aplicacao":"Antes de decisões importantes, devemos ouvir informações confiáveis, considerar consequências e evitar pressa por conveniência.","frase":"Nem toda decisão popular é uma decisão prudente."},{"n":10,"titulo":"Cauda/Clauda e a tempestade Euroaquilão","corpo":["Um vento sul suave inicialmente parece favorecer a saída, mas logo surge o vento tempestuoso chamado Euroaquilão. A tripulação recolhe com dificuldade o bote ao passar ao abrigo de Cauda, reforça o casco com cabos, reduz os aparelhos e lança carga e equipamentos ao mar. Durante dias não se avistam sol nem estrelas; os viajantes perdem a esperança de salvação. O texto não registra desembarque em Cauda."],"listas":[],"ref":"Atos 27:13–20","local":"Ao sul de Creta, perto da pequena ilha de Cauda (Gavdos), Grécia","destaque":"Uma tempestade violenta atinge o navio, que fica à deriva.","licao":"As circunstâncias podem mudar rapidamente e expor a fragilidade das seguranças humanas.","aplicacao":"Nas crises, devemos unir oração, cooperação, coragem e ações concretas de proteção.","frase":"A tempestade revela limites que a tranquilidade escondia."},{"n":11,"titulo":"No mar: promessa, encorajamento e responsabilidade","corpo":["Após longa privação de alimento, Paulo encoraja os ocupantes: um anjo do Deus a quem ele pertence e serve lhe assegurara que ele deveria comparecer perante César e que Deus lhe havia concedido a vida dos companheiros. Na décima quarta noite, suspeitam proximidade de terra e medem a profundidade. Alguns marinheiros tentam fugir; Paulo adverte que todos devem permanecer no navio para serem salvos. Antes do amanhecer, incentiva os 276 presentes a comerem e dá graças a Deus.","Os 276 são o total de pessoas a bordo (At 27:37); não se trata do número de convertidos."],"listas":[],"ref":"Atos 27:21–38","local":"Mediterrâneo central, durante a deriva","destaque":"Paulo anuncia que todos sobreviverão, embora o navio se perca.","licao":"A confiança nas promessas de Deus não elimina a obediência aos meios necessários para sua realização.","aplicacao":"Em uma crise, liderança espiritual significa comunicar esperança verdadeira, orientar com responsabilidade e cuidar do corpo e da mente das pessoas.","frase":"A fé não substitui a responsabilidade; ela fortalece a obediência."},{"n":12,"titulo":"Naufrágio em Malta: todos chegam vivos","corpo":["Quando amanhece, avistam uma baía com praia. O navio encalha em um lugar onde duas correntes se encontram, e a popa começa a ser destruída pelas ondas. Alguns soldados planejam matar os prisioneiros para evitar fugas, mas o centurião Júlio impede a ação para salvar Paulo. Uns chegam nadando; outros, agarrados a tábuas e destroços. Todos escapam com vida e descobrem que a ilha se chama Malta."],"listas":[],"ref":"Atos 27:39–28:1","local":"Costa da ilha de Malta, Mediterrâneo central","destaque":"O navio encalha e se rompe; os 276 ocupantes alcançam terra com vida.","licao":"O cumprimento da promessa não poupou o grupo do naufrágio, mas preservou vidas através dele.","aplicacao":"Quando as estruturas falham, é necessário preservar o essencial: vida, fé, integridade e cuidado mútuo.","frase":"O navio se perdeu; a promessa de Deus permaneceu."},{"n":13,"titulo":"Malta: acolhimento, serpente e cura","corpo":["Os moradores oferecem hospitalidade e acendem uma fogueira devido ao frio e à chuva. Uma víbora se prende à mão de Paulo; os ilhéus interpretam primeiro o episódio como juízo e depois imaginam que ele seja um deus, mas Paulo não sofre dano. Públio, autoridade principal da ilha, hospeda os viajantes durante três dias; seu pai é curado após Paulo orar e impor as mãos. Outros enfermos são atendidos, e os viajantes recebem suprimentos para continuar. Passam aproximadamente três meses na ilha."],"listas":[],"ref":"Atos 28:1–10","local":"Ilha de Malta, atual República de Malta","destaque":"Habitantes acolhem os náufragos; Paulo é mordido por uma víbora e ora por enfermos.","licao":"A hospitalidade e o serviço podem abrir oportunidades para demonstrar a bondade de Deus; o texto não autoriza testes deliberados com animais venenosos.","aplicacao":"Diante de necessidades inesperadas, devemos servir concretamente e rejeitar tanto a superstição quanto a busca de glória pessoal.","frase":"A missão continua quando transformamos uma interrupção em oportunidade de servir."},{"n":14,"titulo":"Siracusa: retomada da viagem","corpo":["Paulo e seus companheiros prosseguem em embarcação que passara o inverno na ilha. Lucas menciona a insígnia dos Dióscuros, designação mitológica associada aos gêmeos Castor e Pólux; trata-se de uma descrição náutica, não de aprovação cristã à idolatria. A parada em Siracusa dura três dias, sem atividades missionárias detalhadas no texto."],"listas":[],"ref":"Atos 28:11–12","local":"Siracusa, Sicília, atual Itália","destaque":"Depois de três meses, embarcam em navio alexandrino e permanecem três dias em Siracusa.","licao":"A narrativa bíblica pode descrever símbolos e costumes pagãos sem endossá-los.","aplicacao":"Interpretar a Escritura exige atenção à diferença entre relato histórico e mandamento religioso.","frase":"Descrever uma cultura não é necessariamente concordar com ela."},{"n":15,"titulo":"Régio: um dia à espera do vento","corpo":["Lucas informa que a embarcação chegou a Régio e, com a chegada de um vento sul no dia seguinte, pôde prosseguir até Putéoli. Não há pregação ou desembarque prolongado descritos."],"listas":[],"ref":"Atos 28:13","local":"Régio, atual Reggio Calabria, Itália","destaque":"O navio chega ao estreito de Messina e permanece por um dia.","licao":"A travessia combina circunstâncias naturais e decisões humanas sob a providência divina.","aplicacao":"Paciência e atenção ao momento adequado podem ser mais sábias que a precipitação.","frase":"Esperar o vento certo também faz parte da jornada."},{"n":16,"titulo":"Putéoli: encontro com irmãos","corpo":["Ao chegarem ao porto italiano, os viajantes encontram cristãos. Lucas relata que foram convidados a permanecer sete dias. A frase seguinte — “e assim fomos para Roma” — assinala a transição para a etapa terrestre. O encontro comprova a presença de seguidores de Cristo na Itália antes da chegada de Paulo à capital."],"listas":[],"ref":"Atos 28:13–14","local":"Putéoli, atual Pozzuoli, região de Nápoles, Itália","destaque":"Paulo encontra irmãos que pedem para os viajantes permanecerem sete dias.","licao":"A igreja pode tornar-se instrumento de consolo e sustentação para servos de Deus em trânsito.","aplicacao":"Receber visitantes, missionários e pessoas em dificuldades é uma expressão prática de amor cristão.","frase":"A hospitalidade transforma uma escala em lugar de fortalecimento."},{"n":17,"titulo":"Praça de Ápio e Três Vendas: irmãos vão ao encontro","corpo":["Ao saberem da aproximação de Paulo, irmãos de Roma vão até a Praça de Ápio e as Três Vendas. Ao vê-los, Paulo dá graças a Deus e se sente animado. O relato apresenta dois locais de encontro ao longo da estrada, não estágios obrigatórios de longa permanência."],"listas":[],"ref":"Atos 28:15","local":"Via Ápia, Itália, ao sul de Roma","destaque":"Cristãos de Roma se deslocam para receber Paulo antes de sua chegada à cidade.","licao":"Mesmo líderes experientes necessitam encorajamento fraterno.","aplicacao":"Devemos tomar a iniciativa de apoiar quem está enfrentando jornadas difíceis.","frase":"Quem fortalece outras pessoas também precisa ser fortalecido."},{"n":18,"titulo":"Roma: prisão domiciliar e Palavra sem impedimento","corpo":["Ao chegar a Roma, Paulo recebe permissão para morar em residência própria, guardado por um soldado. Convoca os principais líderes judeus para explicar sua situação e testemunhar acerca da esperança de Israel. Alguns acolhem a mensagem e outros não; Paulo cita Isaías 6:9–10 e reafirma que a salvação de Deus é anunciada aos gentios. Durante dois anos, recebe visitantes, prega o Reino de Deus e ensina sobre o Senhor Jesus Cristo com toda a ousadia e sem impedimento. Atos termina aqui, sem narrar a sentença do processo."],"listas":[],"ref":"Atos 28:16–31","local":"Roma, capital do Império Romano, atual Itália","destaque":"Paulo chega sob custódia e continua anunciando o Reino de Deus e ensinando sobre Jesus.","licao":"As limitações pessoais e institucionais não impedem necessariamente o testemunho fiel; o centro do relato é o avanço do Evangelho.","aplicacao":"É possível servir a Deus em circunstâncias que não escolhemos, usando os recursos e encontros disponíveis.","frase":"As correntes limitaram os passos de Paulo, mas não silenciaram sua mensagem."}],"lugares":[{"id":"jer","x":1384,"y":742,"nome":"Jerusalém","p":[1]},{"id":"ces","x":1391,"y":672,"nome":"Cesareia","p":[2,3]},{"id":"sid","x":1412,"y":619,"nome":"Sidom","p":[4]},{"id":"chi","x":1300,"y":445,"nome":"Ao abrigo de Chipre","p":[5]},{"id":"mir","x":1091,"y":463,"nome":"Mira da Lícia","p":[6]},{"id":"cni","x":978,"y":452,"nome":"Cnido","p":[7]},{"id":"slm","x":927,"y":568,"nome":"Salmona","p":[8]},{"id":"bpo","x":814,"y":581,"nome":"Bons Portos","p":[9]},{"id":"fen","x":732,"y":570,"nome":"Fenice","p":[9]},{"id":"cau","x":705,"y":638,"nome":"Cauda","p":[10]},{"id":"mar","x":420,"y":628,"nome":"Deriva no mar","p":[11]},{"id":"mal","x":125,"y":606,"nome":"Malta","p":[12,13]},{"id":"sir","x":229,"y":514,"nome":"Siracusa","p":[14]},{"id":"reg","x":264,"y":431,"nome":"Régio","p":[15]},{"id":"put","x":154,"y":277,"nome":"Putéoli","p":[16]},{"id":"api","x":143,"y":184,"nome":"Praça de Ápio","p":[17]},{"id":"trv","x":121,"y":151,"nome":"Três Vendas","p":[17]},{"id":"rom","x":97,"y":112,"nome":"Roma","p":[18]}],"trechos":{"2":[[1384,742],[1384,679],[1391,672]],"4":[[1391,672],[1391,640],[1412,619]],"5":[[1412,619],[1412,574],[1422,549],[1423,502],[1427,498],[1427,471],[1437,459],[1430,453],[1420,448],[1399,443],[1302,443],[1300,445]],"6":[[1300,445],[1268,445],[1251,430],[1246,427],[1242,427],[1237,423],[1230,423],[1228,421],[1217,419],[1196,419],[1187,428],[1181,428],[1153,456],[1142,456],[1133,461],[1124,463],[1091,463]],"7":[[1091,463],[1071,460],[1057,451],[1039,447],[988,447],[985,450],[980,450],[978,452]],"8":[[978,452],[978,455],[967,470],[963,482],[962,528],[960,532],[932,560],[932,563],[927,568]],"9":[[927,568],[924,568],[919,572],[913,572],[911,574],[895,578],[817,578],[814,581]],"10":[[814,581],[749,581],[713,618],[712,627],[708,631],[708,635],[705,638]],"11":[[705,638],[708,628],[712,624],[712,612],[680,612],[678,614],[664,614],[659,619],[640,621],[562,621],[529,619],[522,618],[520,616],[465,617],[452,618],[445,622],[426,623],[420,628]],"12":[[420,628],[370,628],[367,631],[327,633],[274,633],[271,630],[153,630],[150,627],[146,627],[125,606]],"14":[[125,606],[125,603],[128,600],[128,593],[143,578],[166,565],[173,564],[214,523],[220,523],[229,514]],"15":[[229,514],[229,466],[264,431]],"16":[[264,431],[257,380],[204,328],[198,328],[168,298],[163,287],[154,277]],"17":[[154,277],[148,269],[146,262],[146,238],[151,232],[155,222],[155,196],[143,184]],"18":[[143,184],[143,181],[140,178],[140,171],[127,155],[127,148],[122,143],[122,137],[97,112]]}},"abraao":{"aba":"Abraão","titulo":"As Jornadas de Abraão","w":1672,"h":941,"meta":{"texto":"Gênesis 11:27–25:11. Complementares: Atos 7:2–5; Romanos 4; Gálatas 3; Hebreus 11:8–19; Tiago 2:21–23","ideia":"A fé responde à iniciativa de Deus, caminha mesmo sem conhecer todos os detalhes, enfrenta provações e se apoia na fidelidade da promessa divina.","roteiro":["Rota principal: Ur → Harã → Siquém → Betel/Ai → Neguebe → Egito → retorno ao Neguebe e a Betel/Ai → Hebrom (Manre).","Episódios posteriores: deslocamento para a região de Gerar → Berseba → terra de Moriá → retorno a Berseba → acontecimentos finais ligados a Hebrom.","Nota geográfica: “Egito”, “Neguebe” e “terra de Moriá” designam regiões, não endereços exatos. A identificação arqueológica de certos lugares é debatida. O texto bíblico não informa cada caminho intermediário, nem datas absolutas para todos os deslocamentos."]},"paradas":[{"n":1,"titulo":"UR DOS CALDEUS — O COMEÇO DA PEREGRINAÇÃO","corpo":["A antiga Ur é geralmente associada ao sul da Mesopotâmia, no atual Iraque. A família de Terá sai de Ur com destino a Canaã, mas permanece em Harã. Atos 7 apresenta o chamado divino antes de Abraão morar em Harã."],"listas":[],"ref":"Gn 11:27–31; Gn 15:7; At 7:2–4; Js 24:2–3","licao":"A iniciativa da salvação e do chamado pertence ao Senhor. A saída física de Ur sinaliza uma ruptura de orientação e lealdade: a vida de Abraão passa a ser definida pela promessa divina, não apenas pelos vínculos com a terra natal.","aplicacao":"O aluno deve perceber que obedecer nem sempre significa conhecer todo o caminho. Planejamento é importante, mas não substitui confiança no caráter de Deus.","frase":"A fé começa quando a promessa de Deus se torna maior que a segurança do lugar conhecido.","pergunta":"Quais seguranças podem dificultar uma decisão coerente com a Palavra?"},{"n":2,"titulo":"HARÃ — A PARTIDA CONSCIENTE","corpo":["A família reside em Harã, importante local do norte da Mesopotâmia. Abrão sai aos 75 anos acompanhado de Sarai, Ló e dos bens e pessoas reunidos. Há discussão exegética sobre a relação cronológica entre a morte de Terá (Gn 11:32; At 7:4) e a saída de Abrão; o foco do relato está na obediência ao chamado."],"listas":[],"ref":"Gn 11:31–32; 12:1–5; Hb 11:8–10","licao":"Deus promete formar uma grande nação, abençoar Abrão, engrandecer seu nome e abençoar as famílias da terra por meio dele. A promessa possui propósito que ultrapassa o benefício individual.","aplicacao":"Idade, transições familiares e incerteza não anulam a responsabilidade de responder à Palavra. Nossa obediência deve visar também o bem de outras pessoas.","frase":"Ser abençoado por Deus inclui tornar-se instrumento da sua bênção.","pergunta":"Em que sentido as promessas feitas a Abraão incluem as nações?"},{"n":3,"titulo":"SIQUÉM — PROMESSA EM TERRA AINDA NÃO POSSUÍDA","corpo":["Abrão atravessa Canaã até Siquém, junto ao carvalho de Moré. O texto menciona que os cananeus estavam então na terra. Deus aparece a Abrão e promete conceder aquela terra à sua descendência. Ele responde construindo um altar."],"listas":[],"ref":"Gn 12:6–7","licao":"A promessa da terra antecede sua posse efetiva e exige confiança no tempo de Deus. O altar é resposta de adoração, não uma técnica para controlar o cumprimento da promessa.","aplicacao":"O aluno deve distinguir promessa divina de imediatismo religioso. Nem tudo que Deus assegura se manifesta de maneira instantânea.","frase":"Quem confia na promessa aprende a adorar antes de ver seu cumprimento.","pergunta":"Por que é significativo o texto dizer que os cananeus habitavam a terra?"},{"n":4,"titulo":"BETEL E AI — TENDA E ALTAR","corpo":["Abrão arma sua tenda entre Betel, a oeste, e Ai, a leste. Constrói um altar e invoca o nome do Senhor. Depois prossegue em direção ao Neguebe."],"listas":[],"ref":"Gn 12:8–9","licao":"A tenda comunica a condição de peregrino; o altar, a prioridade da adoração. Hebreus 11:9–10 interpreta a vida patriarcal à luz da esperança em uma pátria superior.","aplicacao":"Em deslocamentos e mudanças, a vida devocional não deve ser tratada como um acessório dispensável.","frase":"Quem vive em tendas pode firmar o coração nas promessas eternas.","pergunta":"O que a combinação de tenda e altar ensina sobre prioridades?"},{"n":5,"titulo":"NEGUEBE E EGITO — QUANDO O MEDO FALA MAIS ALTO","corpo":["Uma fome leva Abrão primeiro ao sul (Neguebe) e depois ao Egito. Com receio de ser morto por causa da beleza de Sarai, ele a apresenta como irmã, omitindo a relação conjugal. Sarai é levada à casa de Faraó; o Senhor intervém e Abrão deixa o Egito. A narrativa não identifica a cidade egípcia onde esses fatos ocorreram."],"listas":[],"ref":"Gn 12:9–20","licao":"Crer não significa estar livre de temor ou de escolhas moralmente equivocadas. A tentativa de autoproteção de Abrão colocou Sarai em risco e não deve ser legitimada como um exemplo de prudência.","aplicacao":"Diante de uma crise, devemos avaliar se nossas decisões protegem a verdade e a dignidade das pessoas ou apenas preservam nossos interesses.","frase":"A promessa de Deus é fiel, mesmo quando a nossa coragem falha.","pergunta":"Quais consequências a decisão de Abrão trouxe para Sarai e para Faraó?"},{"n":6,"titulo":"VOLTA A BETEL/AI — RECOMEÇO E SEPARAÇÃO DE LÓ","corpo":["Abrão retorna do Egito, passa pelo Neguebe e chega à região entre Betel e Ai, onde havia construído o altar. A abundância de rebanhos ocasiona conflito entre os pastores de Abrão e Ló. Abrão propõe a separação; Ló escolhe as campinas do Jordão. Depois, o Senhor reafirma a promessa da terra e da descendência."],"listas":[],"ref":"Gn 13:1–17","licao":"A generosidade de Abrão contrasta com a tendência de assegurar para si a melhor porção. Sua confiança na promessa permite ceder a prioridade da escolha sem abrir mão da fidelidade de Deus.","aplicacao":"Conflitos precisam ser administrados com paz e justiça. A busca pela vantagem imediata nem sempre produz o melhor caminho.","frase":"Quem descansa na promessa não precisa vencer toda disputa.","pergunta":"Como o modo de Abrão resolver o conflito pode inspirar a liderança?"},{"n":7,"titulo":"HEBROM / CARVALHAIS DE MANRE — ALTAR, ALIANÇA E ESPERA","corpo":["Abrão se estabelece junto aos carvalhais de Manre, na região de Hebrom, e constrói outro altar. Daí a narrativa avança para o resgate de Ló, o encontro com Melquisedeque (Gn 14), a aliança (Gn 15), a história de Hagar e Ismael (Gn 16), a mudança dos nomes e o sinal da circuncisão (Gn 17), a visita dos mensageiros e a intercessão por Sodoma (Gn 18). Nem todos esses acontecimentos são narrados como ocorridos no mesmo ponto exato."],"listas":[],"ref":"Gn 13:18; 14–18; 19:27–29","licao":"Em Gênesis 15:6, Abrão crê no Senhor e isso lhe é imputado para justiça. A aliança reafirma que o futuro depende da fidelidade divina. Gênesis 16 também mostra as graves consequências de tentar antecipar a promessa por meios humanos que ferem pessoas.","aplicacao":"A fé madura aguarda o tempo de Deus, cuida das relações e recusa usar pessoas como instrumentos de projetos pessoais. A hospitalidade e a intercessão também caracterizam a vida de Abraão.","frase":"Esperar em Deus não é inatividade; é fidelidade enquanto a promessa amadurece.","pergunta":"Como Romanos 4 utiliza Gênesis 15:6 para ensinar sobre justificação?"},{"n":8,"titulo":"GERAR — UMA FALHA REPETIDA E A FIDELIDADE DIVINA","corpo":["Abraão se desloca para a região sul e permanece em Gerar. Novamente descreve Sara como sua irmã diante de Abimeleque, rei de Gerar. Deus protege Sara; depois, nasce Isaque conforme a promessa. A tensão envolvendo Agar e Ismael exige uma leitura sensível às pessoas vulneráveis no relato."],"listas":[],"ref":"Gn 20:1–18; 21:1–21","licao":"A repetição do erro mostra que a maturidade da fé é um processo. O nascimento de Isaque confirma a fidelidade do Senhor, não a perfeição moral de Abraão e Sara.","aplicacao":"É possível reconhecer falhas recorrentes e trabalhar responsavelmente para mudá-las. A providência divina não serve de desculpa para omissões éticas.","frase":"Deus permanece fiel à sua palavra, mas a fidelidade divina não torna nossos erros inocentes.","pergunta":"Que semelhanças e diferenças existem entre Gênesis 12 e 20?"},{"n":9,"titulo":"BERSEBA — O POÇO, O PACTO E O TESTEMUNHO","corpo":["Abraão e Abimeleque estabelecem um acordo relacionado à segurança e à posse de um poço. O lugar recebe o nome Berseba, associado ao juramento e às sete cordeiras no relato. Abraão planta uma tamargueira e invoca o nome do Senhor, Deus Eterno."],"listas":[],"ref":"Gn 21:22–34","licao":"A fé não elimina a necessidade de pactos honestos e convivência responsável. A resolução pública de um conflito pelo acesso à água ganha valor ético e social.","aplicacao":"O aluno deve aprender que espiritualidade também se expressa em compromissos transparentes, respeito e reconciliação.","frase":"A fé que levanta altares também precisa honrar acordos.","pergunta":"Como o episódio do poço pode orientar a resolução de conflitos?"},{"n":10,"titulo":"TERRA DE MORIÁ — A PROVA DA FÉ","corpo":["Deus prova Abraão e ordena que vá à terra de Moriá, onde deveria oferecer Isaque. No momento decisivo, o mensageiro do Senhor impede o sacrifício e um carneiro é oferecido em lugar do filho. A identificação exata do monte mencionado em Gênesis 22 é debatida; 2 Crônicas 3:1 relaciona Moriá à localização posterior do templo em Jerusalém."],"listas":[],"ref":"Gn 22:1–18; Hb 11:17–19; Tg 2:21–23","licao":"O texto apresenta uma prova singular na história da aliança, não uma autorização para violência religiosa. A intervenção divina impede o sacrifício humano. Hebreus enfatiza a confiança de Abraão no poder de Deus; Tiago destaca que a fé genuína se manifesta em obras. A leitura cristã reconhece temas de provisão e sacrifício, sem reduzir o episódio a uma alegoria em que cada detalhe possua equivalência explícita com Cristo.","aplicacao":"Obediência bíblica nunca pode ser usada para justificar ferir filhos ou terceiros. A questão central para o aluno é a confiança no caráter e nas promessas do Deus que provê.","frase":"No lugar da prova, Abraão aprendeu que o Senhor é quem provê.","pergunta":"Como interpretar Gênesis 22 sem transformá-lo em justificativa para abuso espiritual?"},{"n":11,"titulo":"RETORNO A BERSEBA — DEPOIS DA PROVA","corpo":["Após o episódio na terra de Moriá, Gênesis afirma expressamente que Abraão voltou aos seus servos e todos partiram juntos para Berseba, onde Abraão habitou."],"listas":[],"ref":"Gn 22:19","licao":"A Escritura não encerra a história na dramaticidade da prova. A caminhada de fé prossegue na rotina. A confiança em Deus também se expressa no ordinário.","aplicacao":"É necessário continuar obedecendo nos dias comuns, depois das experiências extraordinárias.","frase":"Depois do monte, a fidelidade continua na vida diária.","pergunta":"Que hábitos sustentam a fé entre grandes acontecimentos?"},{"n":12,"titulo":"HEBROM E MACPELA — MEMÓRIA E ESPERANÇA","corpo":["Sara morre em Quiriate-Arba, isto é, Hebrom. Abraão adquire de Efrom o campo e a caverna de Macpela para sepultá-la. Mais adiante, após a morte de Abraão, Isaque e Ismael o sepultam na mesma caverna. O registro final não significa que Abraão tenha morado continuamente em Hebrom durante todas as etapas anteriores."],"listas":[],"ref":"Gn 23:1–20; 25:7–11","licao":"A compra do sepulcro expressa uma posse pequena, porém significativa, da terra prometida. Hebreus 11:13–16 amplia a reflexão ao mostrar que os patriarcas morreram na fé, sem terem recebido a plenitude do prometido.","aplicacao":"A fé não se mede apenas por conquistas visíveis durante a vida. Legado, integridade e esperança são dimensões importantes da perseverança.","frase":"A promessa de Deus ultrapassa os limites de uma única geração.","pergunta":"Como o sepultamento em Macpela ilumina a esperança dos patriarcas?"}],"lugares":[{"id":"ur","x":1198,"y":389,"nome":"Ur dos caldeus","p":[1]},{"id":"har","x":769,"y":165,"nome":"Harã","p":[2]},{"id":"siq","x":1240,"y":502,"nome":"Siquém","p":[3]},{"id":"bet","x":1219,"y":578,"nome":"Betel e Ai","p":[4,6]},{"id":"egi","x":212,"y":590,"nome":"Neguebe e Egito","p":[5]},{"id":"heb","x":1175,"y":713,"nome":"Hebrom (Manre)","p":[7,12]},{"id":"ger","x":997,"y":762,"nome":"Gerar","p":[8]},{"id":"ber","x":1107,"y":811,"nome":"Berseba","p":[9,11]},{"id":"mor","x":1212,"y":631,"nome":"Terra de Moriá","p":[10]}],"trechos":{"2":[[[1198,389],[1164,389],[1149,387],[1133,372],[1122,369],[1112,359],[1095,353],[1088,346],[1045,346],[1014,315],[1005,313],[984,303],[951,302],[931,292],[887,291],[827,231],[825,221],[769,165]]],"3":[[[769,165],[717,165],[711,167],[689,178],[659,208],[606,208],[582,232],[581,249],[579,254],[535,299],[533,306],[525,319],[522,331],[505,349],[502,355],[499,379],[493,385]]],"4":[[[1240,502],[1238,517],[1233,531],[1233,558],[1228,569],[1219,578]]],"5":[[[1219,578],[1219,609],[1217,611],[1217,627],[1192,652],[1186,664],[1185,676],[1173,688],[1173,718],[1152,739],[1138,757],[1129,774],[1129,778],[1118,789],[1111,808],[1015,905]],[[412,540],[412,543],[409,546],[409,552],[394,567],[378,575],[371,575],[362,578],[334,578],[313,557],[245,557],[241,559],[212,590]]],"6":[[[212,590],[212,588],[227,575],[246,571],[262,561],[280,557],[306,557],[320,571],[338,571],[358,578],[383,578],[398,563],[402,555],[402,550],[412,540]],[[1015,905],[1015,902],[1103,814],[1103,799],[1107,784],[1117,771],[1123,758],[1169,712],[1171,708],[1171,691],[1175,685],[1175,660],[1206,629],[1208,625],[1208,602],[1215,591],[1216,581],[1219,578]]],"7":[[[1219,578],[1219,609],[1217,611],[1217,627],[1192,652],[1187,661],[1185,668],[1185,679],[1176,688],[1175,713]]],"8":[[[1175,713],[1142,713],[1115,724],[1088,739],[1067,760],[999,760],[997,762]]],"9":[[[997,762],[997,764],[1019,786],[1026,790],[1052,791],[1073,794],[1093,801],[1104,811],[1107,811]]],"10":[[[1107,811],[1107,808],[1110,805],[1110,798],[1152,756],[1159,746],[1168,723],[1178,713],[1178,691],[1182,681],[1184,669],[1188,661],[1200,648],[1203,640],[1212,631]]],"11":[[[1212,631],[1209,655],[1194,675],[1189,698],[1180,708],[1178,725],[1164,739],[1164,754],[1107,811]]],"12":[[[1107,811],[1107,808],[1110,805],[1110,798],[1155,752],[1164,736],[1169,719],[1175,713]]]}},"exodo":{"aba":"Êxodo","titulo":"O Êxodo — do Egito a Canaã","w":1536,"h":1024,"meta":{"texto":"Êxodo 12–40 • Números 10–36 • Deuteronômio 1–34 • Josué 1–5","ideia":"O Deus que liberta também conduz, forma e disciplina seu povo; sua fidelidade atravessa gerações, mesmo quando a resposta humana é marcada por incredulidade.","data":"Século XV ou XIII a.C. — a data histórica exata não é consensual.","roteiro":["Delta oriental do Egito → Sucote → Etã → Pi-Hairote e travessia do mar → deserto de Sur/Etã → Mara → Elim → deserto de Sim → Refidim → Sinai → Quibrote-Hataavá → Hazerote → região de Cades-Barneia → peregrinação pelo deserto → Cades e monte Hor → contorno de Edom e território a leste do mar Morto → planícies de Moabe → Jordão → Gilgal/Jericó.","Para este curso usamos o sul da península do Sinai e a região de Jebel Musa apenas como referência tradicional de trabalho. O local da travessia do mar e o monte Sinai são debatidos."]},"paradas":[{"n":1,"titulo":"RAMESSÉS / REGIÃO DE GÓSEN","corpo":["A saída ocorre após a Páscoa e a décima praga. Israel deixa o ambiente de servidão. A narrativa atribui a libertação à ação de Deus e estabelece a memória do livramento como parte da identidade do povo."],"listas":[{"t":"Fatos e observações importantes","itens":["A Páscoa precede a partida (Êx 12).","O texto menciona a saída no dia quinze do primeiro mês (Nm 33:3).","O episódio não se reduz a uma migração espontânea: é descrito como ato de redenção."]}],"ref":"Êx 12:29–42; Nm 33:3–5","local":"Delta oriental do Nilo; associação de Ramessés com Pi-Ramessés/Qantir é discutida no contexto histórico.","licao":"Deus inicia a libertação antes que o povo tenha meios de garantir seu próprio futuro. A Páscoa será uma referência decisiva na leitura cristã da obra de Cristo (1Co 5:7).","aplicacao":"Identifique quais formas de dependência e escravidão espiritual precisam ser tratadas pela graça de Deus, sem confundir a escravidão histórica de Israel com desafios pessoais comuns.","frase":"A liberdade começa na ação de Deus, não na autossuficiência humana.","pergunta":"O que esta etapa revela sobre o caráter de Deus e a resposta esperada de seu povo?"},{"n":2,"titulo":"SUCOTE","corpo":["A saída transforma-se em deslocamento concreto. Israel caminha com famílias, rebanhos e seus pertences; passa de uma situação estável, porém opressiva, para a dependência da condução divina."],"listas":[{"t":"Fatos e observações importantes","itens":["Deus orienta a memória e a consagração dos primogênitos (Êx 13:1–16).","A jornada não seguiu inicialmente o caminho mais curto pela terra dos filisteus (Êx 13:17–18)."]}],"ref":"Êx 12:37; 13:20; Nm 33:5–6","local":"Primeiro acampamento registrado após Ramessés; localização exata incerta.","licao":"Nem sempre o caminho escolhido por Deus é o mais curto. A direção divina envolve formação e proteção.","aplicacao":"Ensine a diferença entre pressa e discernimento; decisões rápidas não são necessariamente decisões maduras.","frase":"O caminho mais curto nem sempre é o caminho da formação."},{"n":3,"titulo":"ETÃ — À BORDA DO DESERTO","corpo":["Na borda do deserto, a narrativa destaca a coluna de nuvem de dia e de fogo à noite como manifestações da presença orientadora de Deus."],"listas":[{"t":"Fatos e observações importantes","itens":["A nuvem e o fogo indicam direção e presença (Êx 13:21–22).","A forma exata do trajeto posterior ainda é objeto de reconstrução."]}],"ref":"Êx 13:20–22; Nm 33:6","local":"Região de fronteira entre as áreas habitadas e o deserto; identificação moderna não segura.","licao":"A orientação de Deus acompanha seu povo em ambientes desconhecidos.","aplicacao":"Aplicar à liderança: é preciso caminhar guiado pela Palavra e pela dependência de Deus, não por impulsos.","frase":"A segurança do povo não estava no mapa, mas na presença do Senhor."},{"n":4,"titulo":"PI-HAIROTE E A TRAVESSIA DO MAR","corpo":["Os israelitas são cercados pela ameaça egípcia. O Senhor abre caminho através do mar, o povo passa e o exército perseguidor é derrotado. A travessia torna-se símbolo decisivo do livramento."],"listas":[{"t":"Fatos e observações importantes","itens":["Êx 14 liga confiança e obediência à ação redentora de Deus.","Yam sûf não identifica por si só uma localização moderna única.","O texto enfatiza o acontecimento teológico mais do que a topografia precisa."]}],"ref":"Êx 14:1–31; Nm 33:7–8; Sl 106:7–12","local":"Área entre referências antigas como Migdol e Baal-Zefom; ponto exato da travessia debatido.","licao":"O Senhor salva seu povo quando seus próprios recursos são insuficientes. A travessia também é evocada em 1Co 10:1–2.","aplicacao":"Diante de crises, distinguir entre responsabilidade humana e aquilo que somente Deus pode realizar; evitar promessas de milagres automáticos.","frase":"O Deus que chamou o povo também abriu o caminho.","pergunta":"O que esta etapa revela sobre o caráter de Deus e a resposta esperada de seu povo?"},{"n":5,"titulo":"DESERTO DE SUR / ETÃ E MARA","corpo":["Depois de três dias de caminhada, o povo encontra água amarga. Moisés clama ao Senhor, e a água torna-se potável. O episódio inclui instruções sobre ouvir e obedecer."],"listas":[{"t":"Fatos e observações importantes","itens":["A primeira crise após a vitória envolve uma necessidade básica.","O mesmo povo que cantou após a travessia passa a murmurar diante da escassez."]}],"ref":"Êx 15:22–26; Nm 33:8–9","local":"Após a travessia; Sur em Êxodo e Etã em Números; local de Mara não confirmado.","licao":"A experiência de um grande livramento não substitui a necessidade de confiança cotidiana.","aplicacao":"Convide os alunos a identificar como reagem quando o entusiasmo de uma conquista dá lugar às dificuldades comuns.","frase":"A fé precisa sobreviver ao dia seguinte do milagre."},{"n":6,"titulo":"ELIM E O ACAMPAMENTO JUNTO AO MAR","corpo":["Israel encontra um lugar de descanso e água. Números 33 registra depois outro acampamento junto ao mar, não detalhado em Êxodo."],"listas":[{"t":"Fatos e observações importantes","itens":["O texto registra doze fontes e setenta palmeiras.","É útil distinguir o episódio de Elim da estação adicional “junto ao mar”."]}],"ref":"Êx 15:27; Nm 33:9–10","local":"Oásis com doze fontes e setenta palmeiras, segundo a narrativa; identificação tradicional incerta.","licao":"O cuidado de Deus inclui a provisão e o repouso, não apenas a superação das crises.","aplicacao":"Valorize ritmos de descanso, gratidão e atenção ao sustento recebido.","frase":"O mesmo Deus que conduz no deserto também prepara lugares de refrigério."},{"n":7,"titulo":"DESERTO DE SIM — MANÁ E CODORNIZES","corpo":["Em meio à fome e à murmuração, Deus provê alimento. O maná é recolhido segundo instruções diárias, incluindo preparação para o descanso do sétimo dia."],"listas":[{"t":"Fatos e observações importantes","itens":["A narrativa destaca provisão cotidiana e limites à acumulação (Êx 16).","O episódio torna-se referência para a compreensão do pão do céu em João 6."]}],"ref":"Êx 16:1–36; Nm 33:11","local":"Região entre Elim e Sinai; não confundir “Sim” com “Sinai” nem com “Zim”.","licao":"A provisão é acompanhada por disciplina: Deus ensina confiança, contentamento e obediência.","aplicacao":"Analise a diferença entre planejamento responsável e ansiedade que busca controlar tudo.","frase":"A dependência diária pode ser uma escola de confiança."},{"n":8,"titulo":"DOFCA E ALUS","corpo":["Essas duas paradas são registradas entre o deserto de Sim e Refidim, sem episódios associados no relato principal."],"listas":[{"t":"Fatos e observações importantes","itens":["Nem toda estação possui um relato dramático.","A lista de Números 33 preserva a memória do percurso sem fornecer descrições de todos os lugares."]}],"ref":"Nm 33:12–14","local":"Acampamentos nomeados apenas no itinerário; localização moderna não estabelecida.","licao":"A história do povo de Deus inclui etapas discretas, necessárias ao caminho.","aplicacao":"Ensine a valorizar a fidelidade nas tarefas ordinárias, não apenas eventos marcantes.","frase":"Nem toda etapa memorável precisa ser espetacular."},{"n":9,"titulo":"REFIDIM","corpo":["O povo enfrenta falta de água; Deus provê água da rocha. Depois, Amaleque ataca Israel, e Josué lidera o combate enquanto Moisés intercede. Êxodo 18 também relata o conselho de Jetro e a organização de responsabilidades."],"listas":[{"t":"Fatos e observações importantes","itens":["Massá e Meribá expressam a contenda e a provação (Êx 17:7).","A vitória contra Amaleque envolve combate e intercessão.","Jetro aconselha Moisés a compartilhar responsabilidades de julgamento."]}],"ref":"Êx 17:1–16; 18:1–27; Nm 33:14–15","local":"Localização debatida; Wadi Feiran é uma associação tradicional na rota meridional.","licao":"A liderança precisa depender de Deus e repartir tarefas; nenhuma pessoa foi criada para carregar sozinha todo o peso do povo.","aplicacao":"Reflita sobre oração, organização, delegação e prevenção da exaustão ministerial.","frase":"Uma liderança fiel sabe interceder e também sabe compartilhar responsabilidades."},{"n":10,"titulo":"MONTE SINAI / HOREBE","corpo":["Israel acampa junto ao monte. O Senhor estabelece sua aliança, comunica sua Lei, dá instruções relativas ao culto e ao Tabernáculo e organiza a vida do povo. A apostila destaca a função desses acontecimentos no percurso, reservando o estudo pormenorizado para aulas específicas."],"listas":[{"t":"Fatos e observações importantes","itens":["Êx 19:4–6 vincula eleição, aliança e vocação sacerdotal.","As tábuas, o bezerro de ouro e a renovação da aliança pertencem a Êx 20–34.","O Tabernáculo é construído em Êx 35–40; a glória do Senhor o enche (Êx 40:34–38).","Israel parte do Sinai no segundo ano, conforme Nm 10:11–12."]}],"ref":"Êx 19–40; Lv 1–27; Nm 1–10; Dt 5; Nm 33:15–16","local":"Modelo tradicional: sul do Sinai, área de Jebel Musa; localização real não comprovada.","licao":"O Deus libertador forma um povo santo para viver em sua presença. A graça da libertação precede as exigências da aliança.","aplicacao":"Não confundir santidade com legalismo: estudar a função da Lei no contexto da aliança e sua relação com a revelação em Cristo.","frase":"O Deus que liberta também ensina como viver diante dele.","pergunta":"O que esta etapa revela sobre o caráter de Deus e a resposta esperada de seu povo?"},{"n":11,"titulo":"QUIBROTE-HATAAVÁ","corpo":["No deserto, surgem queixas, desejo desordenado por carne e tensão sobre o peso da liderança. Deus provê codornizes, mas também julga a cobiça do povo; setenta anciãos ajudam Moisés."],"listas":[{"t":"Fatos e observações importantes","itens":["A murmuração atinge o coração do relacionamento com Deus.","Moisés reconhece seus limites diante da responsabilidade.","O nome recorda as consequências da cobiça."]}],"ref":"Nm 10:11–13; 11:1–35; 33:16–17","local":"Primeira estação nomeada após a saída do Sinai em Nm 33.","licao":"A insatisfação permanente pode distorcer a memória da bondade de Deus.","aplicacao":"Ajude os alunos a diferenciar necessidades legítimas de desejos que dominam o coração.","frase":"A abundância de dádivas não cura um coração governado pela cobiça."},{"n":12,"titulo":"HAZEROTE","corpo":["Miriã e Arão falam contra Moisés. O Senhor intervém, Miriã é disciplinada e o povo permanece acampado até que seja readmitida."],"listas":[{"t":"Fatos e observações importantes","itens":["Nm 12 enfatiza o modo singular como Deus se comunicava com Moisés.","A narrativa critica a contestação orgulhosa, sem tornar todo líder imune a correção."]}],"ref":"Nm 11:35–12:16; 33:17–18","local":"Parada posterior a Quibrote-Hataavá; localização incerta.","licao":"A autoridade espiritual não deve ser tratada com inveja, mas também não autoriza abuso ou ausência de prestação de contas.","aplicacao":"Examine como discordar com integridade e como evitar rivalidade no serviço.","frase":"A honra à liderança não pode se separar da fidelidade à verdade."},{"n":13,"titulo":"DESERTO DE PARÃ E CADES-BARNEIA — A CRISE DA ENTRADA","corpo":["Doze homens observam a terra. Dez propagam temor, e a assembleia se rebela; Josué e Calebe encorajam a confiança no Senhor. O resultado é a sentença de peregrinação para a geração incrédula. O conteúdo completo dessa crise merece estudo próprio."],"listas":[{"t":"Fatos e observações importantes","itens":["Distinguir a missão dos espias da tentativa precipitada de subida após o juízo (Nm 14:39–45).","Números 33 oferece uma lista de acampamentos intermediários cuja correlação com os eventos é discutida.","A narrativa bíblica não fornece um calendário contínuo de cada dia dos quarenta anos."]}],"ref":"Nm 12:16–14:45; Dt 1:19–46; Nm 33:18–36","local":"Região no sul de Canaã/Neguebe; Cades é associada por muitos a Tell el-Qudeirat/Ain el-Qudeirat, mas não há unanimidade.","licao":"A incredulidade pode impedir uma geração de desfrutar aquilo que Deus prometeu, sem anular sua fidelidade à aliança.","aplicacao":"Analise como o medo, a pressão coletiva e a visão limitada podem dominar decisões importantes.","frase":"O tamanho dos obstáculos não altera a fidelidade de Deus.","pergunta":"O que esta etapa revela sobre o caráter de Deus e a resposta esperada de seu povo?"},{"n":14,"titulo":"OS ANOS DE PEREGRINAÇÃO E O RETORNO A CADES","corpo":["Entre o episódio dos espias e o avanço final, a narrativa cobre longos anos de peregrinação. Em Cades, no deserto de Zim, Miriã morre e ocorre uma nova crise de água. Moisés e Arão deixam de honrar o Senhor como deveriam, e lhes é anunciado que não conduzirão a assembleia para dentro de Canaã."],"listas":[{"t":"Fatos e observações importantes","itens":["Não presumir que Nm 13 e Nm 20 descrevem o mesmo momento em Cades.","Distinguir “deserto de Sim” (Êx 16) e “deserto de Zim” (Nm 20).","A localização e a sequência de numerosos acampamentos continuam debatidas."]}],"ref":"Nm 14:26–35; 20:1–13; 33:18–37; Dt 2:1–15","local":"Acampamentos diversos; muitos não identificados geograficamente.","licao":"A liderança permanece sujeita à palavra de Deus, mesmo após longa história de serviço.","aplicacao":"Considere a importância da reverência e da obediência em situações de pressão.","frase":"Experiência ministerial não substitui obediência presente."},{"n":15,"titulo":"MONTE HOR E O CONTORNO DE EDOM","corpo":["Edom recusa passagem direta. Israel muda de direção, Arão morre no monte Hor, e Eleazar assume suas vestes sacerdotais. Durante a marcha, a reclamação do povo acompanha o episódio das serpentes e da serpente de bronze."],"listas":[{"t":"Fatos e observações importantes","itens":["A recusa de Edom obriga uma mudança de rota.","Nm 21:4 fala da estrada do mar Vermelho para contornar Edom.","Jo 3:14–15 retoma a serpente levantada como figura na exposição de Jesus."]}],"ref":"Nm 20:14–29; 21:1–9; 33:37–43; Dt 2:1–8","local":"Fronteira de Edom; identificação do monte Hor com Jebel Harun, perto de Petra, é tradicional e debatida.","licao":"O povo precisa reconhecer a santidade de Deus e aprender a depender de sua misericórdia.","aplicacao":"Aplique o texto em ligação com Cristo, evitando tratar a serpente de bronze como objeto mágico.","frase":"O remédio de Deus não é um amuleto, mas um chamado à confiança nele."},{"n":16,"titulo":"OBOTE, IÉ-ABARIM E A MARCHA A LESTE","corpo":["Israel prossegue por sucessivas estações próximas às fronteiras de Edom e Moabe. O texto menciona o vale de Zerede, a região do Arnom, poços e canções ligadas à provisão."],"listas":[{"t":"Fatos e observações importantes","itens":["O narrador registra movimentos por áreas desérticas sem fornecer todos os pontos modernos.","O respeito aos limites territoriais de Edom, Moabe e Amom é tratado em Deuteronômio 2."]}],"ref":"Nm 21:10–20; 33:43–47; Dt 2:13–23","local":"Áreas a leste/sudeste do mar Morto, associadas aos territórios de Moabe; muitas identificações incertas.","licao":"A direção divina também envolve respeito a limites e ao tempo apropriado.","aplicacao":"Examine como perseverar em processos longos sem recorrer à apropriação indevida do que pertence a outros.","frase":"Paciência também é uma forma de obediência."},{"n":17,"titulo":"TRANSJORDÂNIA: SEOM E OGUE","corpo":["Israel encontra resistência de Seom, rei dos amorreus, e de Ogue, rei de Basã. As vitórias ampliam o controle israelita no território transjordânico antes da travessia do Jordão."],"listas":[{"t":"Fatos e observações importantes","itens":["As campanhas pertencem ao período final da peregrinação.","A região a leste do Jordão será central na distribuição posterior de terras para Rúben, Gade e parte de Manassés."]}],"ref":"Nm 21:21–35; Dt 2:24–3:11","local":"Territórios a leste do rio Jordão, incluindo regiões de Hesbom e Basã.","licao":"As promessas divinas não dispensam coragem e responsabilidade diante de desafios reais.","aplicacao":"Observe como a confiança pode operar juntamente com decisões disciplinadas e ação justa.","frase":"A confiança em Deus não dispensa responsabilidade no caminho."},{"n":18,"titulo":"PLANÍCIES DE MOABE — A PREPARAÇÃO FINAL","corpo":["Aqui se concentra a preparação final: os episódios envolvendo Balaão, a grave infidelidade em Peor, o novo recenseamento, as disposições de sucessão e herança e os discursos finais de Moisés. Deuteronômio reapresenta a aliança à nova geração. Moisés contempla Canaã a partir do Nebo e morre antes da travessia."],"listas":[{"t":"Fatos e observações importantes","itens":["Nm 27 apresenta a designação de Josué.","Dt 6 destaca o amor ao Senhor e a transmissão da Palavra.","Dt 34 encerra a liderança de Moisés; Josué conduzirá a entrada na terra."]}],"ref":"Nm 22–36; Dt 1–34; Nm 33:48–49","local":"Margem oriental do Jordão, diante de Jericó; região de Sitim/Abel-Sitim.","licao":"A memória da aliança prepara uma nova geração para viver em fidelidade.","aplicacao":"Converse sobre transmissão da fé, formação de sucessores e responsabilidade de ensinar antes de transferir a liderança.","frase":"Uma geração fiel prepara a próxima para continuar a caminhada.","pergunta":"O que esta etapa revela sobre o caráter de Deus e a resposta esperada de seu povo?"},{"n":19,"titulo":"JORDÃO, GILGAL E ENTRADA EM CANAÃ","corpo":["Josué assume a liderança; os sacerdotes levam a arca, o fluxo do Jordão é interrompido e o povo atravessa em terra seca. Doze pedras são levantadas como memorial. Em Gilgal, Israel renova sinais de identidade e celebra a Páscoa; o maná cessa quando passam a comer do produto da terra."],"listas":[{"t":"Fatos e observações importantes","itens":["A travessia do Jordão é diferente da travessia do mar no Êxodo.","A entrada em Canaã ocorre em Js 3–4; a tomada de Jericó vem depois, em Js 6.","Josué, não Moisés, conduz a travessia."]}],"ref":"Js 1:1–5:12; Dt 34:9","local":"Rio Jordão diante de Jericó; Gilgal aparece como primeiro acampamento dentro da terra.","licao":"A promessa de Deus alcança seu cumprimento histórico nesta etapa, embora o livro de Josué ainda narre conflitos e a ocupação progressiva da terra.","aplicacao":"Converse sobre memória, gratidão, passagem de responsabilidades e fidelidade entre gerações.","frase":"Quem guarda a memória da fidelidade de Deus atravessa o futuro com esperança."}],"lugares":[{"id":"ram","x":267,"y":302,"nome":"Ramessés (Gósen)","p":[1]},{"id":"suc","x":308,"y":343,"nome":"Sucote","p":[2]},{"id":"eta","x":326,"y":397,"nome":"Etã","p":[3]},{"id":"pih","x":381,"y":453,"nome":"Pi-Hairote e a travessia","p":[4]},{"id":"mar","x":475,"y":521,"nome":"Deserto de Sur e Mara","p":[5]},{"id":"eli","x":509,"y":584,"nome":"Elim","p":[6]},{"id":"sim","x":564,"y":660,"nome":"Deserto de Sim","p":[7]},{"id":"dof","x":596,"y":700,"nome":"Dofca e Alus (local incerto)","p":[8]},{"id":"ref","x":635,"y":739,"nome":"Refidim","p":[9]},{"id":"sin","x":776,"y":892,"nome":"Monte Sinai (Horebe)","p":[10]},{"id":"qui","x":873,"y":758,"nome":"Quibrote-Hataavá","p":[11]},{"id":"haz","x":944,"y":677,"nome":"Hazerote","p":[12]},{"id":"cad","x":971,"y":355,"nome":"Cades-Barneia","p":[13,14]},{"id":"hor","x":1161,"y":420,"nome":"Monte Hor","p":[15]},{"id":"obo","x":1299,"y":430,"nome":"Obote","p":[16]},{"id":"ije","x":1332,"y":332,"nome":"Ijé-Abarim","p":[16]},{"id":"hes","x":1326,"y":202,"nome":"Hesbom (Seom e Ogue)","p":[17]},{"id":"pla","x":1297,"y":171,"nome":"Planícies de Moabe","p":[18]},{"id":"gil","x":1269,"y":174,"nome":"Gilgal (Jericó)","p":[19]}],"trechos":{"2":[[267,302],[308,343]],"3":[[308,343],[308,373],[314,384],[326,397]],"4":[[326,397],[326,400],[329,403],[329,409],[344,424],[357,425],[360,428],[360,435],[364,439],[367,439],[381,453]],"5":[[381,453],[404,453],[406,451],[423,449],[438,450],[443,453],[462,472],[466,480],[467,495],[474,502],[475,521]],"6" const IDS=Object.keys(DADOS);
const CATALOGO=[
 {g:'Patriarcas',itens:[{id:'abraao',t:'As Jornadas de Abraão',ref:'Gênesis 11:27–25:11'}]},
 {g:'Êxodo',itens:[{id:'exodo',t:'O Êxodo — do Egito à entrada em Canaã',ref:'Êxodo 12 – Josué 5'}]},
 {g:'Exílio',itens:[{id:'exilio',t:'O Exílio e o Retorno da Babilônia',ref:'2 Reis, Esdras, Neemias'}]},
 {g:'Jesus',itens:[{id:'jesus',t:'O Ministério Itinerante de Jesus',ref:'Evangelhos'}]},
 {g:'Paulo',sub:'quatro viagens',itens:[{id:'v1',t:'A Primeira Viagem Missionária',ref:'Atos 13–14'},{id:'v2',t:'A Segunda Viagem Missionária',ref:'Atos 15:36–18:22'},{id:'v3',t:'A Terceira Viagem Missionária',ref:'Atos 18:23–21:17'},{id:'v4',t:'A Viagem de Paulo a Roma',ref:'Atos 21:17–28:31'}]}
];
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const stage=$('#stage'),world=$('#world'),pop=$('#pop');
$('#ver').textContent=$('#ver2').textContent='v'+APP_VERSION;
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let via=null;
let step=0,cam={s:1,x:0,y:0},base=1,off={x:0,y:0};

/* tema e tamanho da letra */
const setTema=t=>{document.documentElement.dataset.theme=t;document.querySelectorAll('.bTema').forEach(b=>b.textContent=t==='dark'?'☀︎':'☾');store.set('vp-tema',t)};
setTema(store.get('vp-tema')||'dark');
document.querySelectorAll('.bTema').forEach(b=>b.onclick=()=>setTema(document.documentElement.dataset.theme==='dark'?'light':'dark'));
let fs=+(store.get('vp-fs')||17);const setFs=v=>{fs=Math.max(14,Math.min(26,v));document.documentElement.style.setProperty('--fs',fs+'px');store.set('vp-fs',fs)};setFs(fs);
$('#bMais').onclick=()=>setFs(fs+2);$('#bMenos').onclick=()=>setFs(fs-2);

/* tela de entrada */
const PDFS={abraao:'As Jornadas de Abraão',exodo:'O Êxodo — do Egito a Canaã',v1:'Primeira Viagem Missionária de Paulo',v2:'Segunda Viagem Missionária de Paulo',v3:'Terceira Viagem Missionária de Paulo',v4:'Viagem de Paulo a Roma'};
const pdfLink=(id,cls)=>PDFS[id]?`<a class="${cls}" href="estudos/${id}.pdf?v=${APP_VERSION}" download="${PDFS[id]} - Escola MENTOR.pdf" target="_blank" rel="noopener" title="Baixar o estudo em PDF">⤓ Estudo em PDF</a>`:'';
const todos=CATALOGO.flatMap(g=>g.itens.map(i=>({...i,g:g.g})));
const prontos=todos.filter(i=>DADOS[i.id]),breve=todos.filter(i=>!DADOS[i.id]);
$('#grupos').innerHTML=`<section class="grupo"><h2>Mapas prontos <small>${prontos.length}</small></h2><div class="cards">${prontos.map(i=>`<div class="cbox"><button class="card" data-v="${i.id}" style="background-image:url('mapas/${i.id}.jpg?v=${APP_VERSION}')"><i class="era">${i.g}</i><div><b>${esc(i.t)}</b><span>${esc(i.ref)} · ${DADOS[i.id].paradas.length} paradas</span></div></button>${pdfLink(i.id,'pdf')}</div>`).join('')}</div></section>`+
 (breve.length?`<section class="grupo"><h2>Em preparação</h2><div class="cards breves">${breve.map(i=>`<div class="cbox"><div class="card breve" aria-disabled="true"><div><b>${esc(i.t)}</b><span>${i.g} · ${esc(i.ref)}${PDFS[i.id]?' · estudo pronto, mapa em preparação':''}</span></div></div>${pdfLink(i.id,'pdf')}</div>`).join('')}</div></section>`:'');
$('#grupos').onclick=e=>{const b=e.target.closest('button.card');if(b)location.hash=b.dataset.v};
function inicio(){$('#inicio').classList.add('on');document.title='Viagens Bíblicas'}
$('#bInicio').onclick=()=>{location.hash='inicio'};
$('#bSair').onclick=()=>{if(window.porteiroSair)porteiroSair();else location.reload()};
if(!document.querySelector('script[src^="porteiro"]'))$('#bSair').style.display='none';
function rota(){const v=location.hash.slice(1);if(IDS.includes(v)){$('#inicio').classList.remove('on');if(v!==via)abrirViagem(v);else{layout();focar()}}else inicio()}

const D=()=>DADOS[via];
const lugarDe=n=>D().lugares.find(l=>l.p.includes(n));
const curto=t=>t.split(/ — |: /)[0];

function abrirViagem(v){
 via=v;store.set('vp-via',v);if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);
 $('#marca').textContent=D().titulo;$('#pdfTop').innerHTML=pdfLink(v,'pdfTop hide-s');document.title=D().titulo+' · Viagens Bíblicas';
 W=D().w;H=D().h;$('#ov').setAttribute('viewBox',`0 0 ${W} ${H}`);
 $('#mapa').src='mapas/'+v+'.jpg?v='+APP_VERSION;$('#mapa').alt='Mapa: '+D().titulo;
 $('#mks').innerHTML=D().lugares.map(l=>`<div class="mk" data-id="${l.id}" style="left:${l.x/W*100}%;top:${l.y/H*100}%" title="${esc(l.nome)}">${l.p.length>2?l.p[0]+'–'+l.p[l.p.length-1]:l.p.join('·')}</div>`).join('');
 $('#tl').innerHTML=`<button data-s="0">Início</button>`+D().paradas.map(p=>`<button data-s="${p.n}" title="${esc(curto(p.titulo))}">${p.n}</button>`).join('');
 world.classList.add('now');layout();step=0;cam={s:1,x:0,y:0};apply();ir(0,true);
}
$('#tl').onclick=e=>{const b=e.target.closest('button');if(b)ir(+b.dataset.s)};

/* ficha */
function fichaIntro(){
 const d=D(),m=d.meta;
 $('#pN').textContent='Introdução';$('#pT').textContent=d.titulo;$('#pR').textContent=m.texto?m.texto.split('.')[0]:'';
 $('#visitas').innerHTML='';
 $('#popBody').innerHTML=(m.ideia?`<p class="dest">${esc(m.ideia)}</p>`:'')+
  (m.data?`<p><b>Data:</b> ${esc(m.data)}</p>`:'')+(m.equipe?`<p><b>Personagens:</b> ${esc(m.equipe)}</p>`:'')+
  (m.roteiro&&m.roteiro.length?`<h3>Roteiro</h3>`+m.roteiro.map(r=>`<p>${esc(r)}</p>`).join(''):'')+
  `<p class="loc">Toque num número do mapa ou use ▶ para seguir parada por parada.</p>`+(PDFS[via]?`<p>${pdfLink(via,'pdf')}</p>`:'');
}
function ficha(n){
 const p=D().paradas[n-1],l=lugarDe(n);
 $('#pN').textContent=`Parada ${n} de ${D().paradas.length} · ${l.nome}`;
 $('#pT').textContent=p.titulo;$('#pR').textContent=p.ref||'';
 $('#visitas').innerHTML=l.p.length>1?l.p.map(k=>`<button data-s="${k}" class="${k===n?'on':''}">${k}. ${esc(curto(D().paradas[k-1].titulo))}</button>`).join(''):'';
 let h='';
 if(p.local)h+=`<p class="loc">📍 ${esc(p.local)}</p>`;
 if(p.destaque)h+=`<p class="dest">${esc(p.destaque)}</p>`;
 h+=p.corpo.map(c=>`<p>${esc(c)}</p>`).join('');
 if(p.tabela){h+=`<h3>${esc(p.tabTit||'Quadro')}</h3><table>${p.tabela.map((r,i)=>`<tr>${r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</table>`}
 for(const ls of p.listas)h+=(ls.t?`<h3>${esc(ls.t)}</h3>`:'')+`<ul>${ls.itens.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
 if(p.licao)h+=`<h3>Lição</h3><p>${esc(p.licao)}</p>`;
 if(p.aplicacao)h+=`<h3>Aplicação</h3><p class="apl">${esc(p.aplicacao)}</p>`;
 if(p.frase)h+=`<blockquote>“${esc(p.frase)}”</blockquote>`;
 if(p.pergunta)h+=`<div id="perg"><button id="bQ">Pergunta para a turma</button><p>${esc(p.pergunta)}</p></div>`;
 $('#popBody').innerHTML=h;
 const q=$('#bQ');if(q)q.onclick=()=>$('#perg').classList.toggle('show');
}
$('#visitas').onclick=e=>{const b=e.target.closest('button');if(b)ir(+b.dataset.s)};
function abrirFicha(){pop.classList.add('open');$('#reabrir').style.display='none';focar()}
function fecharFicha(){pop.classList.remove('open');$('#reabrir').style.display='block';focar()}
$('#bFechar').onclick=fecharFicha;$('#reabrir').onclick=abrirFicha;

function ir(n,sem){
 const tot=D().paradas.length;step=(n+tot+1)%(tot+1);
 step?ficha(step):fichaIntro();$('#popBody').scrollTop=0;
 const cur=step?lugarDe(step).id:null;
 document.querySelectorAll('.mk').forEach(m=>m.classList.toggle('cur',m.dataset.id===cur));
 [...$('#tl').children].forEach(b=>b.classList.toggle('on',+b.dataset.s===step));
 const a=$('#tl').querySelector('.on');a&&a.scrollIntoView({block:'nearest',inline:'center'});
 const ult=step===tot;$('#bNext').textContent=$('#bProx').textContent=ult?'Recomeçar':'Próxima ▶';
 pop.classList.add('open');$('#reabrir').style.display='none';
 if(!sem)world.classList.remove('now');focar();trecho();
}
$('#bNext').onclick=$('#bProx').onclick=()=>ir(step+1);$('#bPrev').onclick=$('#bAnt').onclick=()=>ir(step-1);

/* trecho animado: mostra o caminho da parada anterior até a atual (pode ter mais de uma parte) */
const segsDe=n=>{const t=D().trechos[n];if(!t)return null;return Array.isArray(t[0][0])?t:[t]};
let raf=null;
function trecho(){
 cancelAnimationFrame(raf);const p1=$('#trecho'),p2=$('#trechoBrilho'),seta=$('#seta');
 const segs=step&&segsDe(step);
 if(!segs){p1.setAttribute('d','');p2.setAttribute('d','');seta.style.display='none';return}
 const d=segs.map(s=>'M'+s.map(p=>p.join(',')).join('L')).join('');p1.setAttribute('d',d);p2.setAttribute('d',d);
 const L=p1.getTotalLength();seta.style.display='';
 p1.style.strokeDasharray=L;p1.style.strokeDashoffset=L;p1.getBoundingClientRect();
 p1.style.transition='stroke-dashoffset 1.4s ease-in-out';p1.style.strokeDashoffset=0;
 const t0=performance.now(),dur=Math.max(1400,Math.min(4000,L*6));
 const tick=t=>{const f=((t-t0)%(dur+600))/dur,u=Math.min(1,f),l=u*L;
  const a=p1.getPointAtLength(l),b=p1.getPointAtLength(Math.min(L,l+2)),c=p1.getPointAtLength(Math.max(0,l-2));
  const ang=Math.atan2(b.y-c.y,b.x-c.x)*180/Math.PI;
  seta.setAttribute('transform',`translate(${a.x},${a.y}) rotate(${ang})`);seta.style.opacity=f>1?0:1;
  raf=requestAnimationFrame(tick)};
 raf=requestAnimationFrame(tick);
}

/* câmera */
function area(){const sw=stage.clientWidth,sh=stage.clientHeight;if(!pop.classList.contains('open'))return{x:0,y:0,w:sw,h:sh};
 const r=pop.getBoundingClientRect(),s=stage.getBoundingClientRect();
 return innerWidth<=760?{x:0,y:0,w:sw,h:Math.max(120,r.top-s.top)}:{x:0,y:0,w:Math.max(160,r.left-s.left),h:sh}}
function layout(){const sw=stage.clientWidth,sh=stage.clientHeight;base=Math.min(sw/W,sh/H);world.style.width=W*base+'px';world.style.height=H*base+'px';off={x:(sw-W*base)/2,y:(sh-H*base)/2}}
function apply(){world.style.transform=`translate(${off.x+cam.x}px,${off.y+cam.y}px) scale(${cam.s})`;world.style.setProperty('--inv',1/cam.s)}
function clamp(){const sw=stage.clientWidth,sh=stage.clientHeight,ww=W*base*cam.s,wh=H*base*cam.s;
 const lim=(v,o,w,sz)=>w<=sz?(sz-w)/2-o:Math.min(-o+sz*.45,Math.max(sz-w-o-sz*.45,v));
 cam.x=lim(cam.x,off.x,ww,sw);cam.y=lim(cam.y,off.y,wh,sh)}
function focar(){
 if(!step){cam={s:1,x:0,y:0};return apply()}
 const l=lugarDe(step),A=area(),pts=segsDe(step)?segsDe(step).flat():[[l.x,l.y]];
 const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),pad=70;
 const bw=(Math.max(...xs)-Math.min(...xs)+2*pad)*base,bh=(Math.max(...ys)-Math.min(...ys)+2*pad)*base;
 const s=Math.max(1,Math.min(2.6,A.w/bw,A.h/bh));
 const px=(Math.max(...xs)+Math.min(...xs))/2*base,py=(Math.max(...ys)+Math.min(...ys))/2*base;
 cam={s,x:A.x+A.w/2-off.x-px*s,y:A.y+A.h/2-off.y-py*s};clamp();apply();
}
$('#bGeral').onclick=()=>{world.classList.remove('now');cam={s:1,x:0,y:0};apply()};
$('#bTr').onclick=()=>{$('#bTr').classList.toggle('on');stage.classList.toggle('semtrecho')};
$('#bNum').onclick=()=>{$('#bNum').classList.toggle('on');stage.classList.toggle('semnum')};

/* toque, arrastar, pinça e roda */
const ptr=new Map();let moved=false,pinch=null,last=null,downAt=null;
stage.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;downAt={x:e.clientX,y:e.clientY};world.classList.add('now');
 stage.setPointerCapture(e.pointerId);last={x:e.clientX,y:e.clientY};
 if(ptr.size===2){const[a,b]=[...ptr.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:cam.s}}stage.classList.add('drag')});
stage.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size===2&&pinch){const[a,b]=[...ptr.values()];zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d);moved=true;return}
 if(Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)>6)moved=true;
 cam.x+=e.clientX-last.x;cam.y+=e.clientY-last.y;last={x:e.clientX,y:e.clientY};clamp();apply()});
const up=e=>{const was=ptr.has(e.pointerId);ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;if(ptr.size===1){const p=[...ptr.values()][0];last={x:p.x,y:p.y}}
 if(!ptr.size)stage.classList.remove('drag');
 if(was&&!moved&&e.type==='pointerup'){const el=document.elementFromPoint(e.clientX,e.clientY),m=el&&el.closest('.mk');
  if(m){const l=D().lugares.find(x=>x.id===m.dataset.id);ir(l.p.includes(step)?step:l.p[0])}}};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
function zoomAt(cx,cy,ns){const r=stage.getBoundingClientRect();ns=Math.max(1,Math.min(6,ns));const px=cx-r.left-off.x,py=cy-r.top-off.y;cam.x=px-(px-cam.x)*ns/cam.s;cam.y=py-(py-cam.y)*ns/cam.s;cam.s=ns;clamp();apply()}
stage.addEventListener('wheel',e=>{e.preventDefault();world.classList.add('now');zoomAt(e.clientX,e.clientY,cam.s*Math.exp(-e.deltaY*.0015))},{passive:false});

/* teclado e tela cheia */
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();ir(step+1)}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();ir(step-1)}
 else if(e.key==='Escape'){pop.classList.contains('open')?fecharFicha():$('#bGeral').onclick()}
 else if(e.key==='f'||e.key==='F')full();
 else if(e.key==='p'||e.key==='P'){const p=$('#perg');p&&p.classList.toggle('show')}});
function full(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}
$('#bFull').onclick=full;
addEventListener('hashchange',rota);

/* atualização */
async function atualizar(){try{if('caches'in window)for(const k of await caches.keys())await caches.delete(k);
 if(navigator.serviceWorker)for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}catch(e){}location.reload()}
document.querySelectorAll('.bUpd').forEach(b=>b.onclick=()=>window.porteiroAtualizar?porteiroAtualizar():atualizar());
/* aviso de versão nova: feito pelo porteiro.js (lê data-versao do index.html publicado) */

new ResizeObserver(()=>{if(!via)return;world.classList.add('now');layout();focar()}).observe(stage);
rota();
}
