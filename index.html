sões importantes, devemos ouvir informações confiáveis, considerar consequências e evitar pressa por conveniência.","frase":"Nem toda decisão popular é uma decisão prudente."},{"n":10,"titulo":"Cauda/Clauda e a tempestade Euroaquilão","corpo":["Um vento sul suave inicialmente parece favorecer a saída, mas logo surge o vento tempestuoso chamado Euroaquilão. A tripulação recolhe com dificuldade o bote ao passar ao abrigo de Cauda, reforça o casco com cabos, reduz os aparelhos e lança carga e equipamentos ao mar. Durante dias não se avistam sol nem estrelas; os viajantes perdem a esperança de salvação. O texto não registra desembarque em Cauda."],"listas":[],"ref":"Atos 27:13–20","local":"Ao sul de Creta, perto da pequena ilha de Cauda (Gavdos), Grécia","destaque":"Uma tempestade violenta atinge o navio, que fica à deriva.","licao":"As circunstâncias podem mudar rapidamente e expor a fragilidade das seguranças humanas.","aplicacao":"Nas crises, devemos unir oração, cooperação, coragem e ações concretas de proteção.","frase":"A tempestade revela limites que a tranquilidade escondia."},{"n":11,"titulo":"No mar: promessa, encorajamento e responsabilidade","corpo":["Após longa privação de alimento, Paulo encoraja os ocupantes: um anjo do Deus a quem ele pertence e serve lhe assegurara que ele deveria comparecer perante César e que Deus lhe havia concedido a vida dos companheiros. Na décima quarta noite, suspeitam proximidade de terra e medem a profundidade. Alguns marinheiros tentam fugir; Paulo adverte que todos devem permanecer no navio para serem salvos. Antes do amanhecer, incentiva os 276 presentes a comerem e dá graças a Deus.","Os 276 são o total de pessoas a bordo (At 27:37); não se trata do número de convertidos."],"listas":[],"ref":"Atos 27:21–38","local":"Mediterrâneo central, durante a deriva","destaque":"Paulo anuncia que todos sobreviverão, embora o navio se perca.","licao":"A confiança nas promessas de Deus não elimina a obediência aos meios necessários para sua realização.","aplicacao":"Em uma crise, liderança espiritual significa comunicar esperança verdadeira, orientar com responsabilidade e cuidar do corpo e da mente das pessoas.","frase":"A fé não substitui a responsabilidade; ela fortalece a obediência."},{"n":12,"titulo":"Naufrágio em Malta: todos chegam vivos","corpo":["Quando amanhece, avistam uma baía com praia. O navio encalha em um lugar onde duas correntes se encontram, e a popa começa a ser destruída pelas ondas. Alguns soldados planejam matar os prisioneiros para evitar fugas, mas o centurião Júlio impede a ação para salvar Paulo. Uns chegam nadando; outros, agarrados a tábuas e destroços. Todos escapam com vida e descobrem que a ilha se chama Malta."],"listas":[],"ref":"Atos 27:39–28:1","local":"Costa da ilha de Malta, Mediterrâneo central","destaque":"O navio encalha e se rompe; os 276 ocupantes alcançam terra com vida.","licao":"O cumprimento da promessa não poupou o grupo do naufrágio, mas preservou vidas através dele.","aplicacao":"Quando as estruturas falham, é necessário preservar o essencial: vida, fé, integridade e cuidado mútuo.","frase":"O navio se perdeu; a promessa de Deus permaneceu."},{"n":13,"titulo":"Malta: acolhimento, serpente e cura","corpo":["Os moradores oferecem hospitalidade e acendem uma fogueira devido ao frio e à chuva. Uma víbora se prende à mão de Paulo; os ilhéus interpretam primeiro o episódio como juízo e depois imaginam que ele seja um deus, mas Paulo não sofre dano. Públio, autoridade principal da ilha, hospeda os viajantes durante três dias; seu pai é curado após Paulo orar e impor as mãos. Outros enfermos são atendidos, e os viajantes recebem suprimentos para continuar. Passam aproximadamente três meses na ilha."],"listas":[],"ref":"Atos 28:1–10","local":"Ilha de Malta, atual República de Malta","destaque":"Habitantes acolhem os náufragos; Paulo é mordido por uma víbora e ora por enfermos.","licao":"A hospitalidade e o serviço podem abrir oportunidades para demonstrar a bondade de Deus; o texto não autoriza testes deliberados com animais venenosos.","aplicacao":"Diante de necessidades inesperadas, devemos servir concretamente e rejeitar tanto a superstição quanto a busca de glória pessoal.","frase":"A missão continua quando transformamos uma interrupção em oportunidade de servir."},{"n":14,"titulo":"Siracusa: retomada da viagem","corpo":["Paulo e seus companheiros prosseguem em embarcação que passara o inverno na ilha. Lucas menciona a insígnia dos Dióscuros, designação mitológica associada aos gêmeos Castor e Pólux; trata-se de uma descrição náutica, não de aprovação cristã à idolatria. A parada em Siracusa dura três dias, sem atividades missionárias detalhadas no texto."],"listas":[],"ref":"Atos 28:11–12","local":"Siracusa, Sicília, atual Itália","destaque":"Depois de três meses, embarcam em navio alexandrino e permanecem três dias em Siracusa.","licao":"A narrativa bíblica pode descrever símbolos e costumes pagãos sem endossá-los.","aplicacao":"Interpretar a Escritura exige atenção à diferença entre relato histórico e mandamento religioso.","frase":"Descrever uma cultura não é necessariamente concordar com ela."},{"n":15,"titulo":"Régio: um dia à espera do vento","corpo":["Lucas informa que a embarcação chegou a Régio e, com a chegada de um vento sul no dia seguinte, pôde prosseguir até Putéoli. Não há pregação ou desembarque prolongado descritos."],"listas":[],"ref":"Atos 28:13","local":"Régio, atual Reggio Calabria, Itália","destaque":"O navio chega ao estreito de Messina e permanece por um dia.","licao":"A travessia combina circunstâncias naturais e decisões humanas sob a providência divina.","aplicacao":"Paciência e atenção ao momento adequado podem ser mais sábias que a precipitação.","frase":"Esperar o vento certo também faz parte da jornada."},{"n":16,"titulo":"Putéoli: encontro com irmãos","corpo":["Ao chegarem ao porto italiano, os viajantes encontram cristãos. Lucas relata que foram convidados a permanecer sete dias. A frase seguinte — “e assim fomos para Roma” — assinala a transição para a etapa terrestre. O encontro comprova a presença de seguidores de Cristo na Itália antes da chegada de Paulo à capital."],"listas":[],"ref":"Atos 28:13–14","local":"Putéoli, atual Pozzuoli, região de Nápoles, Itália","destaque":"Paulo encontra irmãos que pedem para os viajantes permanecerem sete dias.","licao":"A igreja pode tornar-se instrumento de consolo e sustentação para servos de Deus em trânsito.","aplicacao":"Receber visitantes, missionários e pessoas em dificuldades é uma expressão prática de amor cristão.","frase":"A hospitalidade transforma uma escala em lugar de fortalecimento."},{"n":17,"titulo":"Praça de Ápio e Três Vendas: irmãos vão ao encontro","corpo":["Ao saberem da aproximação de Paulo, irmãos de Roma vão até a Praça de Ápio e as Três Vendas. Ao vê-los, Paulo dá graças a Deus e se sente animado. O relato apresenta dois locais de encontro ao longo da estrada, não estágios obrigatórios de longa permanência."],"listas":[],"ref":"Atos 28:15","local":"Via Ápia, Itália, ao sul de Roma","destaque":"Cristãos de Roma se deslocam para receber Paulo antes de sua chegada à cidade.","licao":"Mesmo líderes experientes necessitam encorajamento fraterno.","aplicacao":"Devemos tomar a iniciativa de apoiar quem está enfrentando jornadas difíceis.","frase":"Quem fortalece outras pessoas também precisa ser fortalecido."},{"n":18,"titulo":"Roma: prisão domiciliar e Palavra sem impedimento","corpo":["Ao chegar a Roma, Paulo recebe permissão para morar em residência própria, guardado por um soldado. Convoca os principais líderes judeus para explicar sua situação e testemunhar acerca da esperança de Israel. Alguns acolhem a mensagem e outros não; Paulo cita Isaías 6:9–10 e reafirma que a salvação de Deus é anunciada aos gentios. Durante dois anos, recebe visitantes, prega o Reino de Deus e ensina sobre o Senhor Jesus Cristo com toda a ousadia e sem impedimento. Atos termina aqui, sem narrar a sentença do processo."],"listas":[],"ref":"Atos 28:16–31","local":"Roma, capital do Império Romano, atual Itália","destaque":"Paulo chega sob custódia e continua anunciando o Reino de Deus e ensinando sobre Jesus.","licao":"As limitações pessoais e institucionais não impedem necessariamente o testemunho fiel; o centro do relato é o avanço do Evangelho.","aplicacao":"É possível servir a Deus em circunstâncias que não escolhemos, usando os recursos e encontros disponíveis.","frase":"As correntes limitaram os passos de Paulo, mas não silenciaram sua mensagem."}],"lugares":[{"id":"jer","x":1384,"y":742,"nome":"Jerusalém","p":[1]},{"id":"ces","x":1391,"y":672,"nome":"Cesareia","p":[2,3]},{"id":"sid","x":1412,"y":619,"nome":"Sidom","p":[4]},{"id":"chi","x":1300,"y":445,"nome":"Ao abrigo de Chipre","p":[5]},{"id":"mir","x":1091,"y":463,"nome":"Mira da Lícia","p":[6]},{"id":"cni","x":978,"y":452,"nome":"Cnido","p":[7]},{"id":"slm","x":927,"y":568,"nome":"Salmona","p":[8]},{"id":"bpo","x":814,"y":581,"nome":"Bons Portos","p":[9]},{"id":"fen","x":732,"y":570,"nome":"Fenice","p":[9]},{"id":"cau","x":705,"y":638,"nome":"Cauda","p":[10]},{"id":"mar","x":420,"y":628,"nome":"Deriva no mar","p":[11]},{"id":"mal","x":125,"y":606,"nome":"Malta","p":[12,13]},{"id":"sir","x":229,"y":514,"nome":"Siracusa","p":[14]},{"id":"reg","x":264,"y":431,"nome":"Régio","p":[15]},{"id":"put","x":154,"y":277,"nome":"Putéoli","p":[16]},{"id":"api","x":143,"y":184,"nome":"Praça de Ápio","p":[17]},{"id":"trv","x":121,"y":151,"nome":"Três Vendas","p":[17]},{"id":"rom","x":97,"y":112,"nome":"Roma","p":[18]}],"trechos":{"2":[[1384,742],[1384,679],[1391,672]],"4":[[1391,672],[1391,640],[1412,619]],"5":[[1412,619],[1412,574],[1422,549],[1423,502],[1427,498],[1427,471],[1437,459],[1430,453],[1420,448],[1399,443],[1302,443],[1300,445]],"6":[[1300,445],[1268,445],[1251,430],[1246,427],[1242,427],[1237,423],[1230,423],[1228,421],[1217,419],[1196,419],[1187,428],[1181,428],[1153,456],[1142,456],[1133,461],[1124,463],[1091,463]],"7":[[1091,463],[1071,460],[1057,451],[1039,447],[988,447],[985,450],[980,450],[978,452]],"8":[[978,452],[978,455],[967,470],[963,482],[962,528],[960,532],[932,560],[932,563],[927,568]],"9":[[927,568],[924,568],[919,572],[913,572],[911,574],[895,578],[817,578],[814,581]],"10":[[814,581],[749,581],[713,618],[712,627],[708,631],[708,635],[705,638]],"11":[[705,638],[708,628],[712,624],[712,612],[680,612],[678,614],[664,614],[659,619],[640,621],[562,621],[529,619],[522,618],[520,616],[465,617],[452,618],[445,622],[426,623],[420,628]],"12":[[420,628],[370,628],[367,631],[327,633],[274,633],[271,630],[153,630],[150,627],[146,627],[125,606]],"14":[[125,606],[125,603],[128,600],[128,593],[143,578],[166,565],[173,564],[214,523],[220,523],[229,514]],"15":[[229,514],[229,466],[264,431]],"16":[[264,431],[257,380],[204,328],[198,328],[168,298],[163,287],[154,277]],"17":[[154,277],[148,269],[146,262],[146,238],[151,232],[155,222],[155,196],[143,184]],"18":[[143,184],[143,181],[140,178],[140,171],[127,155],[127,148],[122,143],[122,137],[97,112]]}}};
const IDS=Object.keys(DADOS);
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const stage=$('#stage'),world=$('#world'),pop=$('#pop');
$('#ver').textContent='v'+APP_VERSION;
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let via=IDS.includes(location.hash.slice(1))?location.hash.slice(1):(store.get('vp-via')||'v1');
let step=0,cam={s:1,x:0,y:0},base=1,off={x:0,y:0};

/* tema e tamanho da letra */
const setTema=t=>{document.documentElement.dataset.theme=t;$('#bTema').textContent=t==='dark'?'☀︎':'☾';store.set('vp-tema',t)};
setTema(store.get('vp-tema')||'dark');
$('#bTema').onclick=()=>setTema(document.documentElement.dataset.theme==='dark'?'light':'dark');
let fs=+(store.get('vp-fs')||17);const setFs=v=>{fs=Math.max(14,Math.min(26,v));document.documentElement.style.setProperty('--fs',fs+'px');store.set('vp-fs',fs)};setFs(fs);
$('#bMais').onclick=()=>setFs(fs+2);$('#bMenos').onclick=()=>setFs(fs-2);

$('#abas').innerHTML=IDS.map(k=>`<button data-v="${k}">${DADOS[k].aba}</button>`).join('');
$('#abas').onclick=e=>{const b=e.target.closest('button');if(b)abrirViagem(b.dataset.v)};

const D=()=>DADOS[via];
const lugarDe=n=>D().lugares.find(l=>l.p.includes(n));
const curto=t=>t.split(/ — |: /)[0];

function abrirViagem(v){
 via=v;store.set('vp-via',v);if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);
 [...$('#abas').children].forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 W=D().w;H=D().h;$('#ov').setAttribute('viewBox',`0 0 ${W} ${H}`);
 $('#mapa').src='mapas/'+v+'.jpg?v='+APP_VERSION;$('#mapa').alt='Mapa: '+D().titulo;
 $('#mks').innerHTML=D().lugares.map(l=>`<div class="mk" data-id="${l.id}" style="left:${l.x/W*100}%;top:${l.y/H*100}%" title="${esc(l.nome)}">${l.p.length>2?l.p[0]+'–'+l.p[l.p.length-1]:l.p.join('·')}</div>`).join('');
 $('#tl').innerHTML=`<button data-s="0">Início</button>`+D().paradas.map(p=>`<button data-s="${p.n}" title="${esc(curto(p.titulo))}">${p.n}</button>`).join('');
 world.classList.add('now');layout();step=0;cam={s:1,x:0,y:0};apply();ir(0,true);
}
$('#tl').onclick=e=>{const b=e.target.closest('button');if(b)ir(+b.dataset.s)};

/* ficha */
function fichaIntro(){
 const d=D(),m=d.meta;
 $('#pN').textContent='Introdução';$('#pT').textContent=d.titulo;$('#pR').textContent=m.texto?m.texto.split('.')[0]:'';
 $('#visitas').innerHTML='';
 $('#popBody').innerHTML=(m.ideia?`<p class="dest">${esc(m.ideia)}</p>`:'')+
  (m.data?`<p><b>Data:</b> ${esc(m.data)}</p>`:'')+(m.equipe?`<p><b>Personagens:</b> ${esc(m.equipe)}</p>`:'')+
  (m.roteiro&&m.roteiro.length?`<h3>Roteiro</h3>`+m.roteiro.map(r=>`<p>${esc(r)}</p>`).join(''):'')+
  `<p class="loc">Toque num número do mapa ou use ▶ para seguir parada por parada.</p>`;
}
function ficha(n){
 const p=D().paradas[n-1],l=lugarDe(n);
 $('#pN').textContent=`Parada ${n} de ${D().paradas.length} · ${l.nome}`;
 $('#pT').textContent=p.titulo;$('#pR').textContent=p.ref||'';
 $('#visitas').innerHTML=l.p.length>1?l.p.map(k=>`<button data-s="${k}" class="${k===n?'on':''}">${k}. ${esc(curto(D().paradas[k-1].titulo))}</button>`).join(''):'';
 let h='';
 if(p.local)h+=`<p class="loc">📍 ${esc(p.local)}</p>`;
 if(p.destaque)h+=`<p class="dest">${esc(p.destaque)}</p>`;
 h+=p.corpo.map(c=>`<p>${esc(c)}</p>`).join('');
 if(p.tabela){h+=`<h3>${esc(p.tabTit||'Quadro')}</h3><table>${p.tabela.map((r,i)=>`<tr>${r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</table>`}
 for(const ls of p.listas)h+=(ls.t?`<h3>${esc(ls.t)}</h3>`:'')+`<ul>${ls.itens.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`;
 if(p.licao)h+=`<h3>Lição</h3><p>${esc(p.licao)}</p>`;
 if(p.aplicacao)h+=`<h3>Aplicação</h3><p class="apl">${esc(p.aplicacao)}</p>`;
 if(p.frase)h+=`<blockquote>“${esc(p.frase)}”</blockquote>`;
 if(p.pergunta)h+=`<div id="perg"><button id="bQ">Pergunta para a turma</button><p>${esc(p.pergunta)}</p></div>`;
 $('#popBody').innerHTML=h;
 const q=$('#bQ');if(q)q.onclick=()=>$('#perg').classList.toggle('show');
}
$('#visitas').onclick=e=>{const b=e.target.closest('button');if(b)ir(+b.dataset.s)};
function abrirFicha(){pop.classList.add('open');$('#reabrir').style.display='none';focar()}
function fecharFicha(){pop.classList.remove('open');$('#reabrir').style.display='block';focar()}
$('#bFechar').onclick=fecharFicha;$('#reabrir').onclick=abrirFicha;

function ir(n,sem){
 const tot=D().paradas.length;step=(n+tot+1)%(tot+1);
 step?ficha(step):fichaIntro();$('#popBody').scrollTop=0;
 const cur=step?lugarDe(step).id:null;
 document.querySelectorAll('.mk').forEach(m=>m.classList.toggle('cur',m.dataset.id===cur));
 [...$('#tl').children].forEach(b=>b.classList.toggle('on',+b.dataset.s===step));
 const a=$('#tl').querySelector('.on');a&&a.scrollIntoView({block:'nearest',inline:'center'});
 const ult=step===tot;$('#bNext').textContent=$('#bProx').textContent=ult?'Recomeçar':'Próxima ▶';
 pop.classList.add('open');$('#reabrir').style.display='none';
 if(!sem)world.classList.remove('now');focar();trecho();
}
$('#bNext').onclick=$('#bProx').onclick=()=>ir(step+1);$('#bPrev').onclick=$('#bAnt').onclick=()=>ir(step-1);

/* trecho animado: mostra o caminho da parada anterior até a atual */
let raf=null;
function trecho(){
 cancelAnimationFrame(raf);const p1=$('#trecho'),p2=$('#trechoBrilho'),seta=$('#seta');
 const pts=step&&D().trechos[step];
 if(!pts){p1.setAttribute('d','');p2.setAttribute('d','');seta.style.display='none';return}
 const d='M'+pts.map(p=>p.join(',')).join('L');p1.setAttribute('d',d);p2.setAttribute('d',d);
 const L=p1.getTotalLength();seta.style.display='';
 p1.style.strokeDasharray=L;p1.style.strokeDashoffset=L;p1.getBoundingClientRect();
 p1.style.transition='stroke-dashoffset 1.4s ease-in-out';p1.style.strokeDashoffset=0;
 const t0=performance.now(),dur=Math.max(1400,Math.min(4000,L*6));
 const tick=t=>{const f=((t-t0)%(dur+600))/dur,u=Math.min(1,f),l=u*L;
  const a=p1.getPointAtLength(l),b=p1.getPointAtLength(Math.min(L,l+2)),c=p1.getPointAtLength(Math.max(0,l-2));
  const ang=Math.atan2(b.y-c.y,b.x-c.x)*180/Math.PI;
  seta.setAttribute('transform',`translate(${a.x},${a.y}) rotate(${ang})`);seta.style.opacity=f>1?0:1;
  raf=requestAnimationFrame(tick)};
 raf=requestAnimationFrame(tick);
}

/* câmera */
function area(){const sw=stage.clientWidth,sh=stage.clientHeight;if(!pop.classList.contains('open'))return{x:0,y:0,w:sw,h:sh};
 const r=pop.getBoundingClientRect(),s=stage.getBoundingClientRect();
 return innerWidth<=760?{x:0,y:0,w:sw,h:Math.max(120,r.top-s.top)}:{x:0,y:0,w:Math.max(160,r.left-s.left),h:sh}}
function layout(){const sw=stage.clientWidth,sh=stage.clientHeight;base=Math.min(sw/W,sh/H);world.style.width=W*base+'px';world.style.height=H*base+'px';off={x:(sw-W*base)/2,y:(sh-H*base)/2}}
function apply(){world.style.transform=`translate(${off.x+cam.x}px,${off.y+cam.y}px) scale(${cam.s})`;world.style.setProperty('--inv',1/cam.s)}
function clamp(){const sw=stage.clientWidth,sh=stage.clientHeight,ww=W*base*cam.s,wh=H*base*cam.s;
 const lim=(v,o,w,sz)=>w<=sz?(sz-w)/2-o:Math.min(-o+sz*.45,Math.max(sz-w-o-sz*.45,v));
 cam.x=lim(cam.x,off.x,ww,sw);cam.y=lim(cam.y,off.y,wh,sh)}
function focar(){
 if(!step){cam={s:1,x:0,y:0};return apply()}
 const l=lugarDe(step),A=area(),pts=D().trechos[step]||[[l.x,l.y]];
 const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),pad=70;
 const bw=(Math.max(...xs)-Math.min(...xs)+2*pad)*base,bh=(Math.max(...ys)-Math.min(...ys)+2*pad)*base;
 const s=Math.max(1,Math.min(2.6,A.w/bw,A.h/bh));
 const px=(Math.max(...xs)+Math.min(...xs))/2*base,py=(Math.max(...ys)+Math.min(...ys))/2*base;
 cam={s,x:A.x+A.w/2-off.x-px*s,y:A.y+A.h/2-off.y-py*s};clamp();apply();
}
$('#bGeral').onclick=()=>{world.classList.remove('now');cam={s:1,x:0,y:0};apply()};
$('#bTr').onclick=()=>{$('#bTr').classList.toggle('on');stage.classList.toggle('semtrecho')};
$('#bNum').onclick=()=>{$('#bNum').classList.toggle('on');stage.classList.toggle('semnum')};

/* toque, arrastar, pinça e roda */
const ptr=new Map();let moved=false,pinch=null,last=null,downAt=null;
stage.addEventListener('pointerdown',e=>{ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;downAt={x:e.clientX,y:e.clientY};world.classList.add('now');
 stage.setPointerCapture(e.pointerId);last={x:e.clientX,y:e.clientY};
 if(ptr.size===2){const[a,b]=[...ptr.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:cam.s}}stage.classList.add('drag')});
stage.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size===2&&pinch){const[a,b]=[...ptr.values()];zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d);moved=true;return}
 if(Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)>6)moved=true;
 cam.x+=e.clientX-last.x;cam.y+=e.clientY-last.y;last={x:e.clientX,y:e.clientY};clamp();apply()});
const up=e=>{const was=ptr.has(e.pointerId);ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;if(ptr.size===1){const p=[...ptr.values()][0];last={x:p.x,y:p.y}}
 if(!ptr.size)stage.classList.remove('drag');
 if(was&&!moved&&e.type==='pointerup'){const el=document.elementFromPoint(e.clientX,e.clientY),m=el&&el.closest('.mk');
  if(m){const l=D().lugares.find(x=>x.id===m.dataset.id);ir(l.p.includes(step)?step:l.p[0])}}};
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
function zoomAt(cx,cy,ns){const r=stage.getBoundingClientRect();ns=Math.max(1,Math.min(6,ns));const px=cx-r.left-off.x,py=cy-r.top-off.y;cam.x=px-(px-cam.x)*ns/cam.s;cam.y=py-(py-cam.y)*ns/cam.s;cam.s=ns;clamp();apply()}
stage.addEventListener('wheel',e=>{e.preventDefault();world.classList.add('now');zoomAt(e.clientX,e.clientY,cam.s*Math.exp(-e.deltaY*.0015))},{passive:false});

/* teclado e tela cheia */
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();ir(step+1)}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();ir(step-1)}
 else if(e.key==='Escape'){pop.classList.contains('open')?fecharFicha():$('#bGeral').onclick()}
 else if(e.key==='f'||e.key==='F')full();
 else if(e.key==='p'||e.key==='P'){const p=$('#perg');p&&p.classList.toggle('show')}});
function full(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}
$('#bFull').onclick=full;
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(IDS.includes(v)&&v!==via)abrirViagem(v)});

/* atualização */
async function atualizar(){try{if('caches'in window)for(const k of await caches.keys())await caches.delete(k);
 if(navigator.serviceWorker)for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}catch(e){}location.reload()}
$('#bUpd').onclick=$('#bUpdNow').onclick=atualizar;
async function checar(){try{const r=await fetch('index.html?nc='+Date.now(),{cache:'no-store'});if(!r.ok)return;const m=(await r.text()).match(/APP_VERSION='([^']+)'/);if(m&&m[1]!==APP_VERSION)$('#bar').style.display='flex'}catch(e){}}
setTimeout(checar,3000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checar()});

new ResizeObserver(()=>{world.classList.add('now');layout();focar()}).observe(stage);
abrirViagem(via);
}
</script>
